<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIT TILE 상담 체크리스트</title>
<script>
(function(){
  var ua = navigator.userAgent.toLowerCase();
  if(ua.indexOf('kakaotalk') !== -1){
    var currentUrl = location.href;
    if(/android/i.test(ua)){
      location.href = 'intent://' + currentUrl.replace(/https?:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';
    } else if(/iphone|ipad|ipod/i.test(ua)){
      location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(currentUrl);
    }
  }
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --paper:#F5F6F8;
    --paper-line:#E5E7EB;
    --ink:#1A1A1A;
    --muted:#6B7280;
    --red:#2563EB;
    --red-dark:#1D4ED8;
    --err:#DC2626;
    --green:#16803C;
    --card:#FFFFFF;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    padding-bottom:80px;
  }
  header.top{
    background:var(--ink);
    padding:18px 20px;
  }
  .clip{
    width:80px; height:26px;
    background:#2b2a28;
    border-radius:6px 6px 3px 3px;
    margin:0 auto 8px auto;
    position:relative;
    box-shadow:0 3px 6px rgba(0,0,0,.35);
  }
  .clip:after{
    content:'';
    position:absolute; left:50%; top:6px; transform:translateX(-50%);
    width:34px; height:10px; background:#111; border-radius:2px;
  }
  .brand{
    text-align:center;
    font-family:'Black Han Sans', sans-serif;
    color:#fff;
    letter-spacing:1px;
  }
  .brand .hit{color:var(--red); font-size:26px;}
  .brand .rest{font-size:26px;}
  .brand .sub{
    display:block;
    font-family:'Noto Sans KR', sans-serif;
    font-weight:500;
    font-size:12px;
    color:#C9C4B6;
    letter-spacing:2px;
    margin-top:-2px;
  }
  main{
    max-width:720px;
    margin:22px auto;
    padding:0 16px;
  }
  .view{display:none;}
  .view.active{display:block;}

  .card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:16px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  .card h3{
    margin:0 0 12px 0;
    font-size:14px;
    color:var(--red-dark);
    letter-spacing:.5px;
    display:flex; align-items:center; gap:8px;
  }
  .card h3:before{
    content:'';
    width:4px; height:14px; background:var(--red);
    border-radius:2px;
    display:inline-block;
  }

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  @media(max-width:520px){ .grid2{grid-template-columns:1fr;} }

  label{
    display:block;
    font-size:11px;
    color:var(--muted);
    font-weight:700;
    margin-bottom:4px;
    letter-spacing:.3px;
  }
  input[type=text], input[type=date], input[type=tel], textarea{
    width:100%;
    border:1px solid var(--paper-line);
    border-radius:6px;
    padding:9px 10px;
    font-family:'Noto Sans KR';
    font-size:13px;
    color:var(--ink);
    background:#fff;
  }
  input:focus, textarea:focus{
    outline:none;
    border-color:var(--red);
    box-shadow:0 0 0 3px rgba(37,99,235,.12);
  }
  .field{margin-bottom:10px;}

  table.tile-table{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
  }
  table.tile-table th{
    background:#F1F5F9;
    color:var(--muted);
    font-weight:700;
    padding:8px 6px;
    border:1px solid var(--paper-line);
    font-size:11px;
  }
  table.tile-table td{
    border:1px solid var(--paper-line);
    padding:5px;
    vertical-align:middle;
  }
  table.tile-table td.rowlabel{
    background:#F8FAFC;
    font-weight:700;
    font-size:12px;
    white-space:nowrap;
    text-align:center;
    color:var(--ink);
    position:relative;
  }
  .row-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:16px;
    height:16px;
    border-radius:50%;
    border:none;
    font-size:11px;
    font-weight:900;
    line-height:1;
    cursor:pointer;
    margin-left:4px;
    padding:0;
    vertical-align:middle;
  }
  .row-btn.add{ background:var(--red); color:#fff; }
  .row-btn.remove{ background:#E5E7EB; color:var(--muted); }
  table.tile-table input{
    border:none;
    padding:6px 4px;
    font-size:12.5px;
    background:transparent;
  }
  table.tile-table input:focus{ box-shadow:none; background:#EFF6FF; }

  .ac-wrap{ position:relative; }
  .ac-list{
    position:absolute;
    left:0; right:0; top:100%;
    margin-top:4px;
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:8px;
    box-shadow:0 6px 20px rgba(17,17,17,0.12);
    max-height:220px;
    overflow-y:auto;
    z-index:30;
    display:none;
  }
  .ac-list.show{ display:block; }
  .ac-item{
    padding:9px 10px;
    font-size:13px;
    cursor:pointer;
    border-bottom:1px solid var(--paper-line);
  }
  .ac-item:last-child{ border-bottom:none; }
  .ac-item:hover, .ac-item.active{ background:#EFF6FF; }
  .ac-item .ac-sub{ color:var(--muted); font-size:11.5px; margin-left:6px; }
  td.tilename-cell{ position:relative; }

  .fixture-block{margin-bottom:14px;}
  .fixture-block .label-row{
    display:flex; justify-content:space-between; align-items:center;
    background:#F1F5F9; padding:6px 10px; border-radius:6px 6px 0 0;
    font-size:12px; font-weight:700; color:var(--red-dark);
    border:1px solid var(--paper-line); border-bottom:none;
  }
  .fixture-row{
    display:grid; grid-template-columns:88px 1fr;
    border:1px solid var(--paper-line); border-top:none;
  }
  .fixture-row:last-child{ border-radius:0 0 6px 6px; }
  .fixture-row .name{
    background:#F8FAFC; padding:7px 8px; font-size:12px; font-weight:600;
    border-right:1px solid var(--paper-line);
    display:flex; align-items:center;
  }
  .fixture-row input{
    border:none; padding:7px 8px; font-size:12.5px; width:100%;
  }
  .fixture-row input::placeholder{ color:#9CA3AF; }
  .fixture-row .value{
    padding:7px 8px; font-size:12.5px; display:flex; align-items:center;
  }

  button.primary{
    width:100%;
    background:var(--red);
    color:#fff;
    border:none;
    padding:14px;
    border-radius:8px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    font-family:'Noto Sans KR';
  }
  button.primary:disabled{ background:#D1D5DB; cursor:default; }
  button.primary:active{ background:var(--red-dark); }

  button.secondary{
    width:100%;
    background:#fff;
    color:var(--ink);
    border:1px solid var(--paper-line);
    padding:12px;
    border-radius:8px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    font-family:'Noto Sans KR';
    margin-top:10px;
  }
  button.secondary:active{ background:#F1F5F9; }
  button.secondary:disabled{ opacity:.5; cursor:default; }

  .status-msg{
    text-align:center; font-size:13px; margin-top:10px; font-weight:600;
  }
  .status-msg.ok{ color:var(--green); }
  .status-msg.err{ color:var(--err); }

  .success-banner{
    background:#EAF6EC; border:1px solid #BFE3C4; color:var(--green);
    padding:12px 14px; border-radius:8px; font-size:13.5px; font-weight:700;
    margin-bottom:16px; text-align:center;
  }

  .config-warning{
    background:#FFF3E0; border:1px solid #FFCC80; color:#8A5A00;
    padding:10px 12px; border-radius:8px; font-size:12.5px; margin-bottom:14px;
  }

  .share-toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:10px 18px; border-radius:20px;
    font-size:13px; font-weight:600; z-index:50; box-shadow:0 4px 14px rgba(0,0,0,.25);
  }
</style>

<body>

    <span class="hit">HIT</span><span class="rest"> TILE</span>

<main>

  <div id="configWarning" class="config-warning" style="display:none;">
    ⚠ 아직 저장소(Apps Script 웹앱) 주소가 연결되지 않았어요. index.html 상단의

    <div class="card">

      <div class="grid2">

        <div class="field"><label>연락처</label><input type="tel" id="f-contact" placeholder="010-0000-0000"></div>

        <div class="field"><label>타일시공일</label><input type="date" id="f-tiledate"></div>
        <div class="field"><label>도기시공일</label><input type="date" id="f-ceramicdate"></div>

          <tr><th style="width:18%">공간</th><th>타일 종류 / 컬러</th><th style="width:28%">비고</th></tr>

    <div id="detailContainer"></div>
    <button class="secondary" id="imageBtn" onclick="saveAsImage()">🖼 이미지로 저장</button>
    <button class="primary" style="margin-top:10px;" onclick="startNewEntry()">+ 새 상담 입력하기</button>

</main>

<script>
/* ============ 설정 ============
   아래 URL을 Apps Script 배포 후 받은 "웹 앱 URL"로 교체하세요.
   예: https://script.google.com/macros/s/AKfycb.../exec
*/
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbyGTRMKSfiTQvhAeFDH0BUtFYjhaLal8ba_S9rFGDi2JhiRn49Dp4OR7tQ3GGkmeHze/exec';

// 히트타일 메인 Apps Script(품목등록마스터/배송일정 등을 갖고 있는 그 스프레드시트) 주소.
// 타일 종류/컬러 자동완성(품목등록마스터), 업체명+연락처 자동완성(배송일정 이력)에 사용한다.
const MAIN_ENDPOINT = 'https://script.google.com/macros/s/AKfycbzx_vaUy7Ar1mqidKErG2WYcwNZpL6FGsfI8JNR0nILnSW9hf4bJ_N8aJmDM8J0DOKWwQ/exec';

const DEFAULT_TILE_ROWS = [
  { key:'entrance', label:'현관' },
  { key:'kitchen', label:'주방' },
  { key:'veranda', label:'베란다' },
  { key:'commonWall', label:'공동욕실\n(벽체)' },
  { key:'commonFloor', label:'공동욕실\n(바닥)' },
  { key:'masterWall', label:'안방욕실\n(벽체)' },
  { key:'masterFloor', label:'안방욕실\n(바닥)' },
  { key:'floor', label:'바닥' },
  { key:'artwall', label:'아트월' },
];

let tileRows = DEFAULT_TILE_ROWS.map(r => ({ ...r }));

const FIXTURE_ITEMS = [
  { key:'toilet', label:'양변기' },
  { key:'sink', label:'세면대' },
  { key:'sinkFaucet', label:'세면 수전' },
  { key:'showerFaucet', label:'샤워 수전' },
  { key:'slideBar', label:'슬라이드바' },
  { key:'towelBar', label:'수건걸이' },
  { key:'hanger', label:'옷걸이' },
  { key:'tissue', label:'휴지걸이' },
  { key:'shelf', label:'코너선반' },
  { key:'cabinet', label:'욕실장', hint:'*사이즈' },
  { key:'mirror', label:'거울' },
  { key:'sprayGun', label:'스프레이건', hint:'샤워줄 / 코일' },
  { key:'tub', label:'욕조', hint:'아크릴 / SMC' },
  { key:'partition', label:'파티션' },
  { key:'ventilator', label:'환풍기' },
  { key:'kitchenFaucet', label:'주방수전' },
];

const FIXTURE_ZONES = [
  { key:'common', label:'공용욕실' },
  { key:'master', label:'안방욕실' },
];

let currentRecord = null;

function showView(name){
  document.getElementById('view-input').classList.toggle('active', name==='input');
  document.getElementById('view-detail').classList.toggle('active', name==='detail');
}

// ---- 품목등록마스터 목록(타일 종류/컬러 자동완성용) - 히트타일 메인 Apps Script에서 가져온다 ----
let itemMasterCache = [];
let itemMasterLoaded = false;
async function loadItemMaster(){
  if(itemMasterLoaded) return;
  itemMasterLoaded = true;
  try {
    const res = await fetch(MAIN_ENDPOINT, { method: 'POST', body: JSON.stringify({ action: 'list_item_master' }) });
    const data = await res.json();
    if(data.ok && data.items) itemMasterCache = data.items;
  } catch(e){
    itemMasterLoaded = false; // 실패하면 다음에 다시 시도
  }
}

// ---- 업체명+연락처 목록(배송일정 이력 기반 자동완성용) ----
let companyContactsCache = [];
let companyPhoneByName = {};
let companyContactsLoaded = false;
async function loadCompanyContacts(){
  if(companyContactsLoaded) return;
  companyContactsLoaded = true;
  try {
    const res = await fetch(MAIN_ENDPOINT + '?action=delivery_vendor_contacts');
    const data = await res.json();
    if(data.ok && data.contacts){
      companyContactsCache = data.contacts;
      companyPhoneByName = {};
      data.contacts.forEach(c => { if(c.phone) companyPhoneByName[c.name] = c.phone; });
    }
  } catch(e){
    companyContactsLoaded = false; // 실패하면 다음에 다시 시도
  }
}

// ---- 직접 그려주는 자동완성 드롭다운 (모바일 브라우저는 <datalist> 지원이 부실해서 직접 구현) ----
function setupAutocomplete(inputEl, listEl, getItems, renderLabel, onSelect){
  function render(items){
    listEl.innerHTML = '';
    if(!items.length){ listEl.classList.remove('show'); return; }
    items.slice(0, 30).forEach(it => {
      const div = document.createElement('div');
      div.className = 'ac-item';
      div.innerHTML = renderLabel(it);
      div.addEventListener('mousedown', e => {
        e.preventDefault(); // blur보다 먼저 처리되게 해서 클릭이 씹히지 않도록 함
        listEl.classList.remove('show');
        onSelect(it);
      });
      listEl.appendChild(div);
    });
    listEl.classList.add('show');
  }
  inputEl.addEventListener('input', () => {
    const q = inputEl.value.trim().toLowerCase();
    if(!q){ listEl.classList.remove('show'); return; }
    render(getItems().filter(it => it.name.toLowerCase().indexOf(q) !== -1));
  });
  inputEl.addEventListener('focus', () => {
    if(inputEl.value.trim()) inputEl.dispatchEvent(new Event('input'));
  });
  inputEl.addEventListener('blur', () => {
    setTimeout(() => listEl.classList.remove('show'), 150);
  });
}

// ---- 업체명 자동완성 + 연락처 자동 연동 ----
const companyInput = document.getElementById('f-company');
const companyAcList = document.getElementById('companyAcList');
setupAutocomplete(companyInput, companyAcList,
  () => companyContactsCache,
  (it) => escapeHtml(it.name),
  (it) => {
    companyInput.value = it.name;
    if(it.phone) document.getElementById('f-contact').value = it.phone;
  });
companyInput.addEventListener('blur', () => {
  const phone = companyPhoneByName[companyInput.value.trim()];
  const contactEl = document.getElementById('f-contact');
  if(phone && !contactEl.value) contactEl.value = phone;
});

function isVerandaKey(key){
  return /^veranda\d*$/.test(key);
}

function isLastVerandaRow(key){
  const verandaKeys = tileRows.filter(r => isVerandaKey(r.key)).map(r => r.key);
  return verandaKeys[verandaKeys.length - 1] === key;
}

function addVerandaRow(afterKey){
  const savedTile = collectTileData();
  const verandaCount = tileRows.filter(r => isVerandaKey(r.key)).length;
  const nextNum = verandaCount + 1;
  const newKey = 'veranda' + nextNum;
  const newLabel = '베란다 ' + nextNum;
  const insertIndex = tileRows.findIndex(r => r.key === afterKey) + 1;
  tileRows.splice(insertIndex, 0, { key:newKey, label:newLabel });
  renderTileTable();
  restoreTileData(savedTile);
}

function removeVerandaRow(key){
  const savedTile = collectTileData();
  delete savedTile[key];
  tileRows = tileRows.filter(r => r.key !== key);
  renderTileTable();
  restoreTileData(savedTile);
}

function restoreTileData(savedTile){
  Object.keys(savedTile).forEach(key => {
    const entry = savedTile[key];
    const nameInput = document.querySelector(`input[data-tile="${key}"][data-field="name"]`);
    const memoInput = document.querySelector(`input[data-tile="${key}"][data-field="memo"]`);

    if(memoInput) memoInput.value = entry.memo || '';
    if(nameInput) nameInput.value = entry.name || '';
  });
}

function renderTileTable(){
  const tbody = document.querySelector('#tileTable tbody');
  tbody.innerHTML = tileRows.map(row => {
    const veranda = isVerandaKey(row.key);
    const showAddBtn = veranda && isLastVerandaRow(row.key);
    const showRemoveBtn = veranda && row.key !== 'veranda';

    return `
    <tr data-row-key="${row.key}">
      <td class="rowlabel">
        <span>${row.label.replace('\n','<br>')}</span>
        ${showAddBtn ? `<button type="button" class="row-btn add" onclick="addVerandaRow('${row.key}')" title="베란다 추가">+</button>` : ''}
        ${showRemoveBtn ? `<button type="button" class="row-btn remove" onclick="removeVerandaRow('${row.key}')" title="삭제">×</button>` : ''}
      </td>
      <td class="tilename-cell">
        <input type="text" data-tile="${row.key}" data-field="name" placeholder="타일명/컬러" autocomplete="off">
        <div class="ac-list"></div>
      </td>
      <td><input type="text" data-tile="${row.key}" data-field="memo" placeholder="비고"></td>
    </tr>
  `;
  }).join('');

  attachTileNameAutocomplete();
}

// ---- 타일 종류/컬러 칸마다 품목등록마스터 기반 자동완성을 건다 ----
function attachTileNameAutocomplete(){
  document.querySelectorAll('#tileTable input[data-field="name"]').forEach(nameInput => {
    const acList = nameInput.parentElement.querySelector('.ac-list');
    if(!acList) return;
    setupAutocomplete(nameInput, acList,
      () => itemMasterCache,
      (it) => escapeHtml(it.name) + (it.spec ? `<span class="ac-sub">${escapeHtml(it.spec)}</span>` : ''),
      (it) => { nameInput.value = it.name; });
  });
}

function renderFixtures(){
  const container = document.getElementById('fixtureContainer');
  container.innerHTML = FIXTURE_ZONES.map(zone => `
    <div class="fixture-block">
      <div class="label-row">${zone.label}</div>
      ${FIXTURE_ITEMS.map(item => `
        <div class="fixture-row">
          <div class="name">${item.label}</div>
          <input type="text" data-zone="${zone.key}" data-fixture="${item.key}"
                 placeholder="${item.hint ? item.hint : ''}">
        </div>
      `).join('')}
    </div>
  `).join('');
}

function collectTileData(){
  const data = {};
  document.querySelectorAll('#tileTable input').forEach(inp => {
    const key = inp.getAttribute('data-tile');
    const field = inp.getAttribute('data-field');
    if(!data[key]) data[key] = {};
    data[key][field] = inp.value;
  });
  Object.keys(data).forEach(key => {
    const rowDef = tileRows.find(r => r.key === key);
    data[key].label = rowDef ? rowDef.label.replace('\n', ' ') : key;
  });
  return data;
}

function collectFixtureData(){
  const data = {};
  document.querySelectorAll('#fixtureContainer input').forEach(inp => {
    const zone = inp.getAttribute('data-zone');
    const key = inp.getAttribute('data-fixture');
    if(!data[zone]) data[zone] = {};
    data[zone][key] = inp.value;
  });
  return data;
}

async function saveConsultation(){
  if(WEBAPP_URL === 'YOUR_WEBAPP_URL_HERE'){
    document.getElementById('configWarning').style.display = 'block';
    window.scrollTo(0,0);
    return;
  }
  const btn = document.getElementById('saveBtn');
  const statusEl = document.getElementById('saveStatus');
  const company = document.getElementById('f-company').value.trim();

  if(!company){
    statusEl.textContent = '업체명을 입력해주세요.';
    statusEl.className = 'status-msg err';
    return;
  }

  const payload = {
    company: company,
    address: document.getElementById('f-address').value.trim(),
    contact: document.getElementById('f-contact').value.trim(),
    sitePw: document.getElementById('f-sitepw').value.trim(),
    tileDate: document.getElementById('f-tiledate').value,
    ceramicDate: document.getElementById('f-ceramicdate').value,
    tile: collectTileData(),
    fixture: collectFixtureData(),
    note: document.getElementById('f-note').value.trim(),
  };

  btn.disabled = true;
  btn.textContent = '저장 중...';
  statusEl.textContent = '';

  try {
    const res = await fetch(WEBAPP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    const json = await res.json();
    if(json.success){
      const rec = {
        id: json.id,
        timestamp: new Date().toISOString(),
        '업체': payload.company,
        '현장주소': payload.address,
        '연락처': payload.contact,
        '현장비번': payload.sitePw,
        '타일시공일': payload.tileDate,
        '도기시공일': payload.ceramicDate,
        'tile_json': JSON.stringify(payload.tile),
        'fixture_json': JSON.stringify(payload.fixture),
        '특이사항': payload.note,
      };
      renderDetail(rec);
      resetForm();
    } else {
      throw new Error(json.error || '알 수 없는 오류');
    }
  } catch(err){
    statusEl.textContent = '저장 실패: ' + err.message;
    statusEl.className = 'status-msg err';
  } finally {
    btn.disabled = false;
    btn.textContent = '상담 내용 저장';
  }
}

function resetForm(){
  ['f-company','f-address','f-contact','f-sitepw','f-tiledate','f-ceramicdate','f-note'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.value = '';
  });
  tileRows = DEFAULT_TILE_ROWS.map(r => ({ ...r }));
  renderTileTable();
  renderFixtures();
  const statusEl = document.getElementById('saveStatus');
  statusEl.textContent = '';
}

}

function renderDetail(rec){
  currentRecord = rec;
  const tile = safeParse(rec['tile_json']);
  const fixture = safeParse(rec['fixture_json']);

  let html = `
    <div class="card">
      <h3>현장 기본정보</h3>
      <div class="grid2">
        <div class="field"><label>업체</label><div>${escapeHtml(rec['업체'])}</div></div>
        <div class="field"><label>현장주소</label><div>${escapeHtml(rec['현장주소'])}</div></div>
        <div class="field"><label>연락처</label><div>${escapeHtml(rec['연락처'])}</div></div>
        <div class="field"><label>현장비번</label><div>${escapeHtml(rec['현장비번'])}</div></div>
        <div class="field"><label>타일시공일</label><div>${escapeHtml(rec['타일시공일'])}</div></div>
        <div class="field"><label>도기시공일</label><div>${escapeHtml(rec['도기시공일'])}</div></div>
      </div>
    </div>

    <div class="card">
      <h3>타일 종류 / 컬러</h3>
      <table class="tile-table">
        <thead><tr><th>공간</th><th>타일 종류 / 컬러</th><th>비고</th></tr></thead>
        <tbody>
          ${Object.keys(tile).map(key => {
            const d = tile[key] || {};
            const rowDef = tileRows.find(r => r.key === key);
            const label = d.label || (rowDef ? rowDef.label : key);
            return `<tr>
              <td class="rowlabel">${(label||'').replace('\n','<br>')}</td>
              <td>${escapeHtml(d.name||'-')}</td>
              <td>${escapeHtml(d.memo||'-')}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <div class="card">
      <h3>욕실 집기류</h3>
      ${FIXTURE_ZONES.map(zone => `
        <div class="fixture-block">
          <div class="label-row">${zone.label}</div>
          ${FIXTURE_ITEMS.map(item => {
            const val = (fixture[zone.key] || {})[item.key] || '-';
            return `<div class="fixture-row">
              <div class="name">${item.label}</div>
              <div class="value">${escapeHtml(val)}</div>
            </div>`;
          }).join('')}
        </div>
      `).join('')}
    </div>

    <div class="card">
      <h3>특이사항</h3>
      <div>${escapeHtml(rec['특이사항']) || '없음'}</div>
    </div>
  `;

  document.getElementById('detailContainer').innerHTML = html;
  showView('detail');
  window.scrollTo(0,0);
}

function showToast(msg){
  const el = document.createElement('div');
  el.className = 'share-toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

function downloadBlob(blob, fileName){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function saveAsImage(){
  const btn = document.getElementById('imageBtn');
  const node = document.getElementById('detailContainer');
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '이미지 생성 중...';

  try {
    const canvas = await html2canvas(node, { backgroundColor: '#FFFFFF', scale: 2 });
    canvas.toBlob((blob) => {
      const company = (currentRecord && currentRecord['업체']) ? currentRecord['업체'].replace(/\s/g,'') : 'hittile';
      const fileName = `상담지_${company}.png`;

      canvas.toBlob(async (blobForShare) => {
        const file = new File([blobForShare], fileName, { type:'image/png' });
        if(navigator.canShare && navigator.canShare({ files:[file] })){
          try {
            await navigator.share({ files:[file], title:`HIT TILE 상담지 - ${company}` });
            btn.disabled = false;
            btn.textContent = originalText;
            return;
          } catch(e){
            // 공유 취소/실패 시 다운로드로 대체
          }
        }
        downloadBlob(blob, fileName);
        showToast('이미지가 저장되었습니다.');
        btn.disabled = false;
        btn.textContent = originalText;
      }, 'image/png');
    }, 'image/png');
  } catch(err){
    showToast('이미지 생성 실패: ' + err.message);
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

function safeParse(str){
  try { return JSON.parse(str) || {}; } catch(e){ return {}; }
}
function escapeHtml(str){
  if(str === undefined || str === null) return '';
  return String(str)
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');
}
