<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIT TILE 상담 정리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --paper:#F5F6F8;
    --line:#E5E7EB;
    --ink:#1A1A1A;
    --muted:#6B7280;
    --brand:#D92D20;
    --accent:#2563EB;
    --card:#FFFFFF;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--paper);
    font-family:'Noto Sans KR', sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  main{ max-width:560px; margin:0 auto; padding:0 16px 40px; }
  #report{ background:var(--paper); padding:20px 0 8px; }

  .hero{
    background:var(--ink);
    color:#fff;
    border-radius:16px;
    padding:22px 20px 20px;
  }
  .logo{ font-family:'Black Han Sans', sans-serif; font-size:22px; letter-spacing:1px; }
  .logo span{ color:var(--brand); }
  .hero h1{ margin:14px 0 6px; font-size:20px; font-weight:900; line-height:1.4; }
  .hero p{ margin:0; font-size:13px; color:#C9CDD3; line-height:1.6; }

  h2{ font-size:15px; margin:24px 4px 10px; }

  /* 타일 카드: 사진을 크게, 설명은 아래에 작게 */
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tcard{ background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; break-inside:avoid; }
  .photo{
    aspect-ratio:1 / 1; background:var(--paper) center/cover no-repeat;
    display:flex; align-items:center; justify-content:center;
    color:#9CA3AF; font-size:13px; border-bottom:1px solid var(--line);
  }
  .cap{ padding:8px 10px 10px; }
  .cap .where{ font-size:11.5px; font-weight:700; color:var(--accent); }
  .cap .name{ font-size:13px; font-weight:700; line-height:1.35; margin-top:2px; word-break:keep-all; overflow-wrap:anywhere; }
  .cap .spec{ font-size:11.5px; color:var(--muted); margin-top:1px; }
  .none{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; color:var(--muted); }


  .notice{
    background:#FFF7ED; border:1px solid #FED7AA; color:#9A3412;
    border-radius:12px; padding:12px 14px; font-size:12.5px; line-height:1.7; margin-top:16px;
  }
  .contact{ text-align:center; color:var(--muted); font-size:12.5px; line-height:1.8; margin-top:18px; }
  .contact b{ color:var(--ink); }
  .contact a{ color:var(--ink); }

  .actions{ display:flex; gap:8px; margin-top:16px; }
  .actions button, .actions a{
    flex:1; font-family:inherit; font-size:15px; font-weight:700; text-align:center; text-decoration:none;
    padding:13px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer;
  }
  .actions .primary{ background:var(--ink); border-color:var(--ink); color:#fff; }

  /* ---- A4 출력: 흰 바탕 · 잉크 절약, 공간 카드는 두 줄로 놓아 한 장에 들어가게 ---- */
  @page{ size:A4; margin:14mm 13mm; }
  @media print{
    body{ background:#fff; }
    main{ max-width:none; padding:0; }
    #report{ background:#fff; padding:0; }
    .actions{ display:none !important; }
    .hero{ background:#fff; color:var(--ink); border:none; border-bottom:3px solid var(--ink); border-radius:0; padding:0 0 12px; }
    .hero p{ color:var(--muted); }
    h2{ margin:16px 0 8px; break-after:avoid; }
    .cards{ grid-template-columns:repeat(3, 1fr); gap:8px; }
    .photo{ aspect-ratio:4 / 3; }
    .page + .page{ margin-top:0; break-before:page; }
    .memo .lines{ height:74px; }
    .memo{ margin-top:10px; }
    .hero{ position:relative; }
    .hero-contact{ display:block !important; }
    .contact{ display:none; }
    .notice{ padding:8px 12px; font-size:11.5px; line-height:1.6; margin-top:10px; }
    h2{ margin:12px 0 6px; }
    .tcard{ border-color:#D1D5DB; }
    .hero h1{ font-size:22px; }
    .hero p{ font-size:13.5px; }
      .memo{ display:block !important; }
      .notice{ background:#fff; border-color:#D1D5DB; color:var(--ink); break-inside:avoid; }
    .contact{ margin-top:12px; }
  }

  .hero-contact{ display:none; position:absolute; right:0; top:2px; text-align:right; font-size:11.5px; line-height:1.6; color:var(--muted); }
  .hero-contact b{ color:var(--ink); }
  .memo{ display:none; margin-top:14px; break-inside:avoid; }
  .memo .label{ font-size:13px; font-weight:700; margin-bottom:6px; }
  .memo .lines{ border:1px solid #D1D5DB; border-radius:12px; height:112px;
    background:repeating-linear-gradient(#fff 0 36px, #E5E7EB 36px 37px); }

  .page + .page{ margin-top:28px; }
  body[data-only="tile"] #pg-fixture, body[data-only="fixture"] #pg-tile{ display:none; }
  .actions{ flex-wrap:wrap; }
  .actions button{ flex:1 1 40%; }

  .empty{ background:var(--card); border-radius:14px; padding:40px 20px; text-align:center; color:var(--muted); margin-top:20px; line-height:1.7; }
</style>
</head>
<body>
<main>
  <div id="report"></div>
  <div class="actions" id="actions" style="display:none;">
    <button class="primary" type="button" id="printBtn">전체 인쇄</button>
    <button type="button" id="onlyTile">타일만 인쇄</button>
    <button type="button" id="onlyFixture">도기만 인쇄</button>
    <button type="button" id="saveImg">이미지로 저장</button>
  </div>
</main>

<script>
// 상담체크리스트의 [고객 리포트 보내기]가 만든 링크로 열린다. 내용은 주소 뒤(#) 데이터에만 들어 있고
// 서버에서 다른 상담을 불러오지 않으므로, 링크를 받은 사람은 자기 상담 내용만 볼 수 있다.
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

function decodeData(){
  const raw = location.hash.replace(/^#d=/, '');
  if(!raw) return null;
  try {
    const b64 = raw.replace(/-/g, '+').replace(/_/g, '/');
    const bin = atob(b64 + '==='.slice((b64.length + 3) % 4));
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  } catch(e){
    return null;
  }
}

function formatDate(s){
  const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return s || '';
  const d = new Date(+m[1], +m[2] - 1, +m[3]);
  return `${+m[2]}월 ${+m[3]}일 (${'일월화수목금토'[d.getDay()]})`;
}

function render(data){
  const root = document.getElementById('report');
  if(!data){
    root.innerHTML = '<div class="empty">상담 정리 내용을 찾을 수 없어요.<br>받으신 링크를 다시 눌러 주세요.</div>';
    return;
  }
  document.title = `HIT TILE 상담 정리 - ${data.co || ''}`;

  // 같은 공간에서 같은 타일이면(예: 공용욕실 벽체 · 바닥) 사진 한 장으로 합친다
  const cards = [];
  (data.t || []).forEach(t => {
    const same = cards.find(c => c.g === t.g && c.n === t.n);
    if(same){ if(t.p) same.parts.push(t.p); return; }
    cards.push({ g: t.g, n: t.n, s: t.s, img: t.img, parts: t.p ? [t.p] : [] });
  });

  const tilesHtml = cards.length ? `<div class="cards">${cards.map(c => `
      <div class="tcard">
        <div class="photo"${c.img ? ` style="background-image:url('${esc(c.img)}')"` : ''}>${c.img ? '' : '샘플 사진'}</div>
        <div class="cap">
          <div class="where">${esc(c.g)}${c.parts.length ? ' · ' + esc(c.parts.join(' · ')) : ''}</div>
          <div class="name">${esc(c.n)}</div>
          ${c.s ? `<div class="spec">${esc(c.s)}</div>` : ''}
        </div>
      </div>`).join('')}</div>` : '<div class="none">고르신 타일이 없습니다.</div>';

  // 도기 · 욕실 제품도 같은 카드. 같은 제품이 두 욕실에 다 들어가면 한 장으로 합친다
  const fx = [];
  (data.f || []).forEach(f => {
    const same = fx.find(c => c.i === f.i && c.n === f.n);
    if(same){ same.zones.push(f.z); return; }
    fx.push({ i: f.i, n: f.n, img: f.img, zones: [f.z] });
  });
  const fixturesHtml = fx.length ? `<div class="cards">${fx.map(c => `
      <div class="tcard">
        <div class="photo"${c.img ? ` style="background-image:url('${esc(c.img)}')"` : ''}>${c.img ? '' : '제품 사진'}</div>
        <div class="cap">
          <div class="where">${esc(c.zones.join(' · '))} · ${esc(c.i)}</div>
          <div class="name">${esc(c.n)}</div>
        </div>
      </div>`).join('')}</div>` : '';

  const contact = '<div class="hero-contact"><b>히트타일</b> 053-767-1663<br>대구 수성구 수성로 58</div>';
  const memo = '<div class="memo"><div class="label">메모</div><div class="lines"></div></div>';
  const info = `${data.date ? `상담일 ${esc(formatDate(data.date))}` : ''}${data.site ? `<br>현장 ${esc(data.site)}` : ''}${data.dl ? `<br>배송 예정 ${esc(formatDate(data.dl))}` : ''}`;

  // 타일 한 장, 도기 한 장 — 인쇄하면 각각 A4 한 장씩 나온다
  root.innerHTML = `
    <section class="page" id="pg-tile">
      <div class="hero">
        <div class="logo">HIT <span>TILE</span></div>${contact}
        <h1>${esc(data.co || '고객')}님,<br>오늘 고르신 타일을 정리해 드려요</h1>
        <p>${info}</p>
      </div>
      <h2>타일</h2>
      ${tilesHtml}
      <div class="notice">
        타일은 생산 시기(로트)와 조명에 따라 색감이 조금 다르게 보일 수 있어요.
        변경하실 부분이 있으면 편하게 연락 주세요.
      </div>
      ${memo}
    </section>
    ${fixturesHtml ? `
    <section class="page" id="pg-fixture">
      <div class="hero">
        <div class="logo">HIT <span>TILE</span></div>${contact}
        <h1>${esc(data.co || '고객')}님,<br>오늘 고르신 욕실 도기 · 제품이에요</h1>
        <p>${info}</p>
      </div>
      <h2>도기 · 욕실 제품</h2>
      ${fixturesHtml}
      ${memo}
    </section>` : ''}
    <div class="contact">
      <b>히트타일</b> · <a href="tel:053-767-1663">053-767-1663</a><br>
      대구 수성구 수성로 58
    </div>`;
  document.getElementById('onlyTile').style.display = fixturesHtml ? '' : 'none';
  document.getElementById('onlyFixture').style.display = fixturesHtml ? '' : 'none';
  document.getElementById('actions').style.display = '';
}

async function saveImage(){
  const btn = document.getElementById('saveImg');
  const text = btn.textContent;
  btn.disabled = true; btn.textContent = '이미지 만드는 중...';
  try {
    const canvas = await html2canvas(document.getElementById('report'), { backgroundColor: '#F5F6F8', scale: 2 });
    const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
    const file = new File([blob], '히트타일_상담정리.png', { type: 'image/png' });
    if(navigator.canShare && navigator.canShare({ files: [file] })){
      try { await navigator.share({ files: [file], title: 'HIT TILE 상담 정리' }); return; } catch(e){ /* 취소 시 다운로드 */ }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = file.name;
    document.body.appendChild(a); a.click(); a.remove();
  } catch(err){
    alert('이미지를 만들지 못했어요: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = text;
  }
}

document.getElementById('saveImg').addEventListener('click', saveImage);
// 타일만 / 도기만 인쇄: 다른 페이지를 잠깐 숨기고 인쇄한 뒤 되돌린다
function printOnly(which){
  if(which) document.body.dataset.only = which; else delete document.body.dataset.only;
  window.print();
}
window.addEventListener('afterprint', () => { delete document.body.dataset.only; });
document.getElementById('printBtn').addEventListener('click', () => printOnly(''));
document.getElementById('onlyTile').addEventListener('click', () => printOnly('tile'));
document.getElementById('onlyFixture').addEventListener('click', () => printOnly('fixture'));
render(decodeData());
</script>
</body>
</html>
