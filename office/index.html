<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>히트타일 AI 사무실</title>
<!--
  AI 사무실: 직원(클라우드 세션 · .claude/agents)이 지금 무엇을 하는지 도트 그림 사무실로 보여 준다.
  - 그림은 전부 이 파일에서 직접 그린다(인라인 SVG 네모 조각). 외부 그림 · 라이브러리 없음.
  - 숫자 · 말풍선은 웹앱의 실제 자료만 쓴다. 자료가 없거나 호출이 실패하면 「준비 중」 · 「대기」 · 「확인 실패」.
      대표님 확인 대기 수 : owner_check_list(status 대기)의 항목 수만(제목 · 내용은 화면에 넣지 않는다)
      직원 상태 · 최근 기록 : office_log_recent (gas/Office.js, 시트 「활동기록」)
      오늘 확정한 전표 수   : office_log_recent의 slips (확정할 때마다 서버가 센 수)
  - 공개 화면이다. 거래처 이름 · 금액 · 주소 · 비번은 넣지 않는다.
-->
<style>
  :root{
    --bg:#f5f6f8; --ink:#1a1a1a; --muted:#6b7280; --line:rgba(17,17,17,0.09);
    --brass:#2563eb; --brass-deep:#1d4ed8; --brass-soft:#eff6ff; --card:#ffffff; --ok:#15803d; --warn:#b1503f;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;
    background:var(--bg); color:var(--ink); padding:0 0 40px; }
  header{ padding:20px 5vw 14px; border-bottom:1px solid var(--line); position:relative; }
  header h1{ margin:0 0 4px; font-size:20px; }
  header p{ margin:0; color:var(--muted); font-size:12.5px; padding-right:70px; }
  .home-link{ position:absolute; top:22px; right:5vw; font-size:12px; color:var(--muted); text-decoration:none;
    border:1px solid var(--line); border-radius:999px; padding:6px 12px; background:var(--card); }
  main{ max-width:480px; margin:0 auto; padding:12px 12px 0; }

  .bar{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin:2px 2px 10px; font-size:12px; color:var(--muted); }
  .bar button{ font:inherit; font-size:12px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .bar .err{ color:var(--warn); font-weight:600; }

  .chips{ display:flex; gap:8px; margin:0 0 12px; }
  .chip{ flex:1 1 0; min-width:0; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:9px 10px; text-align:center; }
  .chip b{ display:block; font-size:16px; line-height:1.3; white-space:nowrap; }
  .chip span{ display:block; font-size:11px; color:var(--muted); margin-top:1px; white-space:nowrap; }
  .chip b.soft{ font-size:13.5px; color:var(--muted); font-weight:600; }
  .chip b.bad{ font-size:13.5px; color:var(--warn); }

  /* ---- 사무실(도트 그림) ---- */
  .px{ display:block; image-rendering:pixelated; image-rendering:crisp-edges; }
  .room{ border:3px solid #3b2f2f; border-radius:6px; overflow:hidden; background:#e9dfcd;
    box-shadow:0 2px 0 #3b2f2f, 0 6px 14px rgba(15,23,42,.12); }
  .wall{ position:relative; height:76px; background:#cfd8e3;
    background-image:linear-gradient(#b9c4d2,#b9c4d2); background-size:100% 4px; background-position:0 34px; background-repeat:no-repeat;
    border-bottom:6px solid #6b4a2f; }
  .wall .px{ position:absolute; bottom:0; }
  .wall .sign{ position:absolute; left:50%; top:10px; transform:translateX(-50%); background:#b91c1c; color:#fff; font-size:12px; font-weight:800;
    letter-spacing:.5px; padding:5px 12px 6px; border:3px solid #3b2f2f; box-shadow:3px 3px 0 rgba(59,47,47,.35); white-space:nowrap; }
  .floor{ padding:10px 6px 14px;
    background-color:#efe6d6;
    background-image:linear-gradient(#ded2bd 2px,transparent 2px),linear-gradient(90deg,#ded2bd 2px,transparent 2px);
    background-size:32px 32px; background-position:-1px -1px; }

  .boss{ display:block; position:relative; width:232px; margin:0 auto 6px; padding-top:34px; text-decoration:none; color:inherit; }
  .boss .px{ margin:0 auto; }
  .boss .badge{ position:absolute; top:0; left:50%; transform:translateX(-50%); white-space:nowrap;
    font-size:13px; font-weight:800; padding:6px 12px; border:3px solid #3b2f2f; background:#fff; color:#3b2f2f; box-shadow:3px 3px 0 rgba(59,47,47,.3); }
  .boss .badge.red{ background:#dc2626; color:#fff; }
  .boss .badge.bad{ color:var(--warn); }
  .boss .badge::after{ content:""; position:absolute; left:50%; bottom:-9px; margin-left:-3px; width:6px; height:6px; background:#3b2f2f; }
  .boss .badge.red{ animation:badge 1.2s steps(1) infinite; }
  @keyframes badge{ 0%{ transform:translateX(-50%) translateY(0);} 50%{ transform:translateX(-50%) translateY(-2px);} }

  .plate{ display:block; width:max-content; max-width:100%; margin:3px auto 0; font-size:12px; font-weight:800; color:#fff; background:#3b2f2f; padding:3px 9px; white-space:nowrap; }
  .plate small{ font-weight:600; font-size:10.5px; opacity:.85; margin-left:3px; }

  .desks{ display:grid; grid-template-columns:1fr 1fr; gap:14px 4px; margin-top:6px; }
  .desk{ font:inherit; color:inherit; background:none; border:0; padding:0; margin:0; cursor:pointer; text-align:center; min-width:0;
    display:flex; flex-direction:column; align-items:center; }
  .desk .px{ width:160px; height:120px; max-width:100%; }
  .bubble{ position:relative; width:164px; max-width:100%; height:50px; margin-bottom:7px; padding:3px 6px; background:#fff; border:3px solid #3b2f2f;
    font-size:11.5px; line-height:1.25; font-weight:700; display:flex; align-items:center; justify-content:center; text-align:center;
    box-shadow:3px 3px 0 rgba(59,47,47,.22); }
  .bubble::after{ content:""; position:absolute; left:50%; bottom:-9px; margin-left:8px; width:6px; height:6px; background:#3b2f2f; }
  .bubble .t{ display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; word-break:keep-all; overflow-wrap:anywhere; }
  .is-idle .bubble{ background:#f1f5f9; color:#64748b; border-color:#94a3b8; box-shadow:none; }
  .is-idle .bubble::after{ background:#94a3b8; }
  .is-fail .bubble{ background:#fff; color:var(--warn); border-color:#94a3b8; box-shadow:none; }
  .is-fail .bubble::after{ background:#94a3b8; }
  .is-done .bubble{ background:#ecfdf5; color:#166534; }

  /* 상태별로 보이는 조각 */
  .scr-work,.scr-done,.zzz,.steam,.eyes-shut,.spark,.smile{ display:none; }
  .is-work .scr-work{ display:inline; }
  .is-work .steam{ display:inline; }
  .is-done .scr-done,.is-done .spark,.is-done .smile{ display:inline; }
  .is-done .mouth{ display:none; }
  .is-idle .zzz,.is-idle .eyes-shut{ display:inline; }
  .is-idle .eyes-open,.is-fail .scr-idle-dot{ display:none; }
  .is-idle .lit,.is-fail .lit{ display:none; }

  /* 움직임 — 도트 느낌이 나게 뚝뚝 끊어서(steps). transform · opacity만 쓴다. 책상마다 --sp(빠르기) · --dl(엇박)이 다르다 */
  .desk{ --sp:1; --dl:0s; }
  .is-work .hl{ animation:tap calc(.34s * var(--sp)) steps(1) var(--dl) infinite; }
  .is-work .hr{ animation:tap calc(.34s * var(--sp)) steps(1) calc(var(--dl) - .17s * var(--sp)) infinite; }
  .is-work .head{ animation:nod calc(1.9s * var(--sp)) steps(1) var(--dl) infinite; }
  .is-work .eyes-open{ animation:blink calc(2.7s * var(--sp)) steps(1) var(--dl) infinite; }
  .is-work .scr-a{ animation:flip calc(.9s * var(--sp)) steps(1) var(--dl) infinite; }
  .is-work .scr-b{ animation:flip calc(.9s * var(--sp)) steps(1) calc(var(--dl) - .45s * var(--sp)) infinite; }
  .is-work .cursor{ animation:flip .5s steps(1) infinite; }
  .is-work .steam{ animation:steam 1.2s steps(1) var(--dl) infinite; }
  .is-work .bubble{ animation:bob calc(1.6s * var(--sp)) steps(1) var(--dl) infinite; }
  .is-idle .head{ animation:doze calc(2.8s * var(--sp)) steps(1) var(--dl) infinite; }
  .is-idle .z1{ animation:zz 2.2s steps(1) var(--dl) infinite; }
  .is-idle .z2{ animation:zz 2.2s steps(1) calc(var(--dl) - 1.1s) infinite; }
  .is-done .head{ animation:nod .9s steps(1) infinite; }
  .is-done .hand{ animation:cheer .6s steps(1) infinite; }
  .is-done .spark{ animation:flip .7s steps(1) infinite; }
  .is-done .bubble{ animation:bob 1s steps(1) infinite; }
  .boss .head{ animation:nod 3s steps(1) infinite; }
  .boss .eyes-open{ animation:blink 3.6s steps(1) infinite; }
  .boss .bhand{ animation:tap 1.4s steps(1) infinite; }
  .leaf{ animation:sway 1.8s steps(1) infinite; }
  .cloud-a{ animation:drift 8s steps(10) infinite alternate; }
  .pend{ animation:pend 1s steps(1) infinite; }
  .tick{ animation:flip 1s steps(1) infinite; }
  .led{ animation:flip .8s steps(1) infinite; }
  /* 서류 나르는 로봇: 통로를 왔다 갔다 */
  .aisle{ position:relative; height:40px; margin:2px 4px 0; overflow:hidden; }
  .walk{ position:absolute; left:0; right:0; top:2px; animation:walk 9s steps(45) infinite alternate; }
  .walk .turn{ display:block; width:36px; animation:turn 18s steps(1) infinite; }
  .walk .hop{ display:block; animation:hop .4s steps(1) infinite; }
  .walk .leg-a{ animation:flip .4s steps(1) infinite; }
  .walk .leg-b{ animation:flip .4s steps(1) -.2s infinite; }
  @keyframes walk{ 0%{ transform:translateX(0);} 100%{ transform:translateX(calc(100% - 36px));} }
  @keyframes turn{ 0%{ transform:scaleX(1);} 50%{ transform:scaleX(-1);} }
  @keyframes hop{ 0%{ transform:translateY(0);} 50%{ transform:translateY(-2px);} }
  @keyframes tap{ 0%{ transform:translateY(0);} 50%{ transform:translateY(-1px);} }
  @keyframes cheer{ 0%{ transform:translateY(-3px);} 50%{ transform:translateY(-5px);} }
  @keyframes nod{ 0%{ transform:translateY(0);} 70%{ transform:translateY(1px);} }
  @keyframes doze{ 0%{ transform:translateY(1px);} 50%{ transform:translateY(2px);} }
  @keyframes bob{ 0%{ transform:translateY(0);} 50%{ transform:translateY(-3px);} }
  @keyframes blink{ 0%{ opacity:1;} 92%{ opacity:0;} }
  @keyframes flip{ 0%{ opacity:1;} 50%{ opacity:0;} }
  @keyframes steam{ 0%{ opacity:.9; transform:translateY(0);} 50%{ opacity:.5; transform:translateY(-1px);} }
  @keyframes zz{ 0%{ opacity:0; transform:translate(0,2px);} 25%{ opacity:1; transform:translate(0,1px);} 50%{ opacity:1; transform:translate(1px,0);} 75%{ opacity:.5; transform:translate(1px,-1px);} }
  @keyframes drift{ 0%{ transform:translateX(-3px);} 100%{ transform:translateX(7px);} }
  @keyframes sway{ 0%{ transform:translateX(0);} 50%{ transform:translateX(1px);} }
  @keyframes pend{ 0%{ transform:translateX(-1px);} 50%{ transform:translateX(1px);} }
  @media (prefers-reduced-motion: reduce){
    .room *, .room *::before, .room *::after{ animation:none !important; }
  }

  .legend{ margin:10px 2px 0; font-size:11.5px; color:var(--muted); line-height:1.6; }

  /* 책상을 눌렀을 때 작은 창 */
  .sheet-bg{ position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:flex-end; justify-content:center; z-index:50; }
  .sheet-bg.on{ display:flex; }
  .sheet{ width:100%; max-width:480px; background:var(--card); border-radius:16px 16px 0 0; padding:16px 16px 20px; max-height:80vh; overflow:auto; }
  .sheet h2{ margin:0; font-size:17px; }
  .sheet .st{ display:inline-block; margin:8px 0 0; font-size:12px; font-weight:700; padding:3px 9px; border-radius:6px; background:#64748b; color:#fff; }
  .sheet .st.work{ background:#b91c1c; } .sheet .st.done{ background:var(--ok); }
  .sheet .job{ margin:10px 0 12px; font-size:13.5px; line-height:1.6; color:#334155; word-break:keep-all; }
  .sheet h3{ margin:0 0 6px; font-size:13px; }
  .sheet ul{ list-style:none; margin:0; padding:0; }
  .sheet li{ display:flex; gap:8px; font-size:12.5px; padding:7px 0; border-top:1px solid var(--line); line-height:1.4; }
  .sheet li .when{ flex:0 0 auto; color:var(--muted); white-space:nowrap; }
  .sheet li .what{ min-width:0; overflow-wrap:anywhere; }
  .sheet li .what b{ margin-right:4px; }
  .sheet .none{ font-size:12.5px; color:var(--muted); padding:8px 0; border-top:1px solid var(--line); }
  .sheet .close{ display:block; width:100%; margin-top:14px; font:inherit; font-size:14px; font-weight:700; padding:11px; border-radius:10px;
    border:1px solid var(--line); background:#f8fafc; color:var(--ink); }
</style>
<link rel="stylesheet" href="../assets/hit-theme.css">
</head>
<body>

<header>
  <h1>AI 사무실</h1>
  <p>직원들이 지금 무슨 일을 하는지 한눈에. 책상을 누르면 자세히 보여요.</p>
  <a class="home-link" href="../">첫 화면</a>
</header>

<main>
  <div class="bar">
    <span id="lastLoad">불러오는 중...</span>
    <button type="button" id="refreshBtn">새로고침</button>
  </div>

  <div class="chips">
    <div class="chip"><b id="saleCount" class="soft">불러오는 중</b><span>오늘 확정 판매 전표</span></div>
    <div class="chip"><b id="purchaseCount" class="soft">불러오는 중</b><span>오늘 확정 구매 전표</span></div>
  </div>

  <div class="room">
    <div class="wall" id="wall"><div class="sign">히트타일</div></div>
    <div class="floor">
      <a class="boss" href="../confirm/" id="boss" aria-label="대표님 확인으로 가기">
        <span class="badge" id="bossBadge">대표님 확인 불러오는 중</span>
        <span id="bossArt"></span>
        <span class="plate">대표님 자리<small>누르면 대표님 확인</small></span>
      </a>
      <div class="aisle" aria-hidden="true"><div class="walk"><span class="turn"><span class="hop" id="walker"></span></span></div></div>
      <div class="desks" id="desks"></div>
    </div>
  </div>

  <p class="legend">말풍선은 직원이 일을 시작 · 끝낼 때 남긴 한 줄이에요. 시작하고 2시간이 지나면 「대기」로 바뀌어요.<br>
    전표 수는 업무 사이트 · 클라우드가 오늘 확정한 횟수예요(이카운트 화면에서 직접 넣은 전표는 빠져요).</p>
</main>

<div class="sheet-bg" id="sheetBg">
  <div class="sheet" role="dialog" aria-modal="true" id="sheet"></div>
</div>

<script src="../appkey.js"></script>
<script>
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzx_vaUy7Ar1mqidKErG2WYcwNZpL6FGsfI8JNR0nILnSW9hf4bJ_N8aJmDM8J0DOKWwQ/exec';
  const REFRESH_MS = 5 * 60 * 1000;   // 5분마다 새로 불러옴
  const RETHINK_MS = 30 * 1000;       // 그 사이에는 서버를 부르지 않고 「몇 분 지났나」만 다시 계산
  const WORK_MAX_MIN = 120;           // 「시작」 뒤 이만큼 지나면 대기로 본다(끝 기록을 빠뜨렸을 때)
  const DONE_SHOW_MIN = 10;           // 「끝」 뒤 이만큼은 「방금 끝냄」
  const MODAL_LINES = 5;

  // 직원 — 이름 · 하는 일은 CLAUDE.md 「직원 명단」(클라우드는 「역할 분담」)을 따른다. id는 gas/Office.js OFFICE_STAFF_IDS와 같아야 한다.
  // sp · dl: 책상마다 움직임 빠르기 · 엇박(서로 박자가 달라 보이게)
  const STAFF = [
    { id: 'cloud', sp: 1, dl: 0, name: '클라우드', tag: '창구', job: '대표님 창구. 사진 읽기 · 짧은 확인과 답 · 연락함 전달을 맡고, 긴 일은 직원이나 까망이에게 맡겨요.',
      skin: '#f2c9a0', hair: '#7c4a1e', style: 'short', shirt: '#2563eb', prop: 'headset' },
    { id: 'sales', sp: 0.8, dl: 0.3, name: '판매·구매', tag: '', job: '발주서 → 확인표 · 판매 등록, 매입처 전표 → 구매 등록, 매입처 발주(지금은 숙지), 거래처 전표 · 결제금액 문구.',
      skin: '#f5d0a9', hair: '#2b2b2b', style: 'long', shirt: '#b91c1c', prop: 'papers' },
    { id: 'item', sp: 1.25, dl: 0.9, name: '품목등록', tag: '', job: '품목 등록, 한글명 붙이기, 중복 정리.',
      skin: '#e8b98a', hair: '#5b3a1a', style: 'bun', shirt: '#0f766e', prop: 'tiles' },
    { id: 'delivery', sp: 0.9, dl: 0.55, name: '배송', tag: '', job: '배송 · 반품 일정, 장보기 · 짐 짜기 · 출하지시 문구, 반품 전표 기준, 매입처 반품.',
      skin: '#f2c9a0', hair: '#1f2937', style: 'cap', shirt: '#ea580c', cap: '#1d4ed8', prop: 'box' },
    { id: 'accounting', sp: 1.1, dl: 1.3, name: '경리', tag: '조주임 · 까망이', job: '입금 확인, 미수금 · 잔액, 결제 요청, 이카운트 대조. 조주임(까망이)이 총괄해요.',
      skin: '#f5d0a9', hair: '#111111', style: 'cat', shirt: '#27272a', prop: 'calc' },
    { id: 'consult', sp: 0.75, dl: 0.15, name: '상담·견적', tag: '', job: '상담체크리스트 → 타일량 계산 → 판매등록 연결.',
      skin: '#f2c9a0', hair: '#a16207', style: 'long', shirt: '#7c3aed', prop: 'samples' },
    { id: 'system', sp: 1.4, dl: 0.7, name: '시스템', tag: '', job: '업무 사이트 수정, 서버 기능 · 중계서버 배포 순서 정리.',
      skin: '#e8b98a', hair: '#374151', style: 'short', shirt: '#475569', prop: 'server', glasses: true },
    { id: 'strategy', sp: 0.95, dl: 1.1, name: '전략', tag: '', job: '성장플랜 스스로 갱신, 매출 · 마진 · 경쟁 가격 분석, 업그레이드 제안.',
      skin: '#f5d0a9', hair: '#44403c', style: 'bun', shirt: '#be185d', prop: 'chart' }
  ];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ---------- 도트 그림 ----------
  function r(x, y, w, h, c, cls) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" fill="' + c + '"' + (cls ? ' class="' + cls + '"' : '') + '/>';
  }
  function g(cls, inner) { return '<g class="' + cls + '">' + inner + '</g>'; }
  function svg(w, h, scale, inner) {
    return '<svg class="px" viewBox="0 0 ' + w + ' ' + h + '" width="' + (w * scale) + '" height="' + (h * scale) + '" shape-rendering="crispEdges" aria-hidden="true">' + inner + '</svg>';
  }
  const OUT = '#3b2f2f';

  function hairSvg(s, x) {   // x = 머리 왼쪽 칸(머리 너비 10)
    let h = r(x, 3, 10, 3, s.hair) + r(x, 6, 1, 2, s.hair) + r(x + 9, 6, 1, 2, s.hair) + r(x + 1, 2, 8, 1, s.hair);
    if (s.style === 'long') h += r(x - 1, 5, 1, 9, s.hair) + r(x + 10, 5, 1, 9, s.hair) + r(x, 8, 1, 5, s.hair) + r(x + 9, 8, 1, 5, s.hair);
    if (s.style === 'bun') h += r(x + 3, 0, 4, 2, s.hair);
    if (s.style === 'cat') h += r(x, 0, 2, 3, s.hair) + r(x + 8, 0, 2, 3, s.hair) + r(x + 1, 1, 1, 1, '#f9a8d4') + r(x + 8, 1, 1, 1, '#f9a8d4');
    if (s.style === 'cap') h = r(x, 3, 10, 3, s.cap) + r(x + 1, 2, 8, 1, s.cap) + r(x - 1, 6, 12, 1, '#1e3a8a') + r(x + 4, 3, 2, 2, '#fff') + r(x, 7, 1, 2, s.hair) + r(x + 9, 7, 1, 2, s.hair);
    return h;
  }

  function headSvg(s, x) {
    let h = '';
    h += r(x + 1, 5, 8, 7, s.skin) + r(x + 2, 12, 6, 1, s.skin);                // 얼굴 · 턱
    h += r(x, 8, 1, 2, s.skin) + r(x + 9, 8, 1, 2, s.skin);                      // 귀
    h += hairSvg(s, x);
    h += g('eyes-open', r(x + 3, 8, 1, 2, '#1f2937') + r(x + 6, 8, 1, 2, '#1f2937'));
    h += g('eyes-shut', r(x + 2, 9, 2, 1, '#1f2937') + r(x + 6, 9, 2, 1, '#1f2937'));
    h += r(x + 2, 10, 1, 1, '#f4a79a') + r(x + 7, 10, 1, 1, '#f4a79a');          // 볼
    h += r(x + 4, 11, 2, 1, '#9a3412', 'mouth');
    h += g('smile', r(x + 3, 10, 1, 1, '#9a3412') + r(x + 4, 11, 2, 1, '#9a3412') + r(x + 6, 10, 1, 1, '#9a3412'));
    if (s.glasses) h += r(x + 2, 8, 3, 1, '#0f172a') + r(x + 5, 8, 3, 1, '#0f172a') + r(x + 2, 9, 1, 1, '#0f172a') + r(x + 7, 9, 1, 1, '#0f172a');
    if (s.prop === 'headset') h += r(x - 1, 7, 1, 3, '#0f172a') + r(x + 10, 7, 1, 3, '#0f172a') + r(x, 2, 10, 1, '#0f172a') + r(x - 1, 3, 1, 4, '#0f172a') + r(x + 10, 3, 1, 4, '#0f172a') + r(x - 1, 10, 1, 2, '#0f172a') + r(x, 12, 2, 1, '#0f172a');
    return g('head', h);
  }

  function propSvg(kind) {   // 책상 오른쪽 위(31~38칸, 20줄 위)
    if (kind === 'papers') return r(31, 17, 6, 3, '#fff') + r(31, 17, 6, 1, '#e2e8f0') + r(32, 15, 6, 2, '#fff') + r(32, 15, 6, 1, '#cbd5e1') + r(33, 16, 3, 1, '#94a3b8') + r(32, 18, 4, 1, '#94a3b8');
    if (kind === 'tiles') return r(31, 16, 3, 4, '#e2e8f0') + r(31, 16, 3, 1, '#f8fafc') + r(34, 14, 3, 6, '#93c5fd') + r(34, 14, 3, 1, '#bfdbfe') + r(37, 17, 1, 3, '#a8a29e') + r(31, 18, 3, 1, '#cbd5e1');
    if (kind === 'box') return r(31, 14, 7, 6, '#c08a4e') + r(31, 14, 7, 1, '#d9a566') + r(34, 14, 1, 6, '#f1dcb5') + r(32, 17, 1, 2, '#8a5a2b');
    if (kind === 'calc') return r(32, 15, 5, 5, '#1f2937') + r(33, 16, 3, 1, '#86efac') + r(33, 18, 1, 1, '#e5e7eb') + r(35, 18, 1, 1, '#e5e7eb') + r(31, 19, 1, 1, '#facc15') + r(30, 19, 1, 1, '#fde68a');
    if (kind === 'samples') return r(31, 16, 2, 4, '#fca5a5') + r(33, 15, 2, 5, '#fde68a') + r(35, 16, 2, 4, '#86efac') + r(37, 17, 1, 3, '#93c5fd') + r(31, 19, 7, 1, '#78716c');
    if (kind === 'server') return r(32, 12, 5, 8, '#334155') + r(32, 12, 5, 1, '#475569') + r(33, 14, 3, 1, '#0f172a') + r(33, 16, 3, 1, '#0f172a') + r(33, 18, 1, 1, '#22c55e', 'led') + r(35, 18, 1, 1, '#f59e0b');
    if (kind === 'chart') return r(31, 11, 8, 8, '#fff') + r(31, 11, 8, 1, '#94a3b8') + r(31, 18, 8, 1, '#94a3b8') + r(31, 11, 1, 8, '#94a3b8') + r(38, 11, 1, 8, '#94a3b8')
      + r(33, 16, 1, 2, '#60a5fa') + r(35, 14, 1, 4, '#60a5fa') + r(37, 13, 1, 5, '#ef4444') + r(34, 19, 2, 1, '#64748b');
    // 기본: 머그잔
    return r(33, 17, 3, 3, '#fff') + r(36, 18, 1, 1, '#fff') + r(33, 17, 3, 1, '#e2e8f0') + g('steam', r(34, 14, 1, 2, '#cbd5e1'));
  }

  function deskSvg(s) {
    const X = 19;   // 머리 왼쪽 칸
    let h = '';
    h += r(17, 9, 14, 12, '#475569') + r(18, 10, 12, 10, '#64748b');             // 의자 등받이
    h += r(X + 4, 13, 2, 1, s.skin);                                             // 목
    h += r(X - 1, 14, 12, 7, s.shirt) + r(X - 2, 15, 1, 5, s.shirt) + r(X + 10, 15, 1, 5, s.shirt) + r(X + 4, 14, 2, 1, s.skin);   // 몸
    h += headSvg(s, X);
    // 모니터(왼쪽)
    h += r(3, 7, 13, 11, OUT) + r(4, 8, 11, 9, '#0f172a') + r(8, 18, 3, 2, '#334155') + r(6, 19, 7, 1, '#334155');
    h += r(4, 8, 11, 9, '#12314f', 'lit');
    h += g('scr-work', g('scr-a', r(5, 9, 6, 1, '#7dd3fc') + r(5, 11, 8, 1, '#a7f3d0') + r(5, 13, 4, 1, '#fde68a') + r(5, 15, 7, 1, '#7dd3fc'))
      + g('scr-b', r(5, 9, 8, 1, '#a7f3d0') + r(5, 11, 5, 1, '#7dd3fc') + r(5, 13, 7, 1, '#7dd3fc') + r(5, 15, 3, 1, '#fde68a')) + r(13, 15, 1, 1, '#fff', 'cursor'));
    h += g('scr-done', r(4, 8, 11, 9, '#14532d') + r(6, 12, 1, 1, '#86efac') + r(7, 13, 1, 1, '#86efac') + r(8, 14, 1, 1, '#86efac') + r(9, 13, 1, 1, '#86efac') + r(10, 12, 1, 1, '#86efac') + r(11, 11, 1, 1, '#86efac') + r(12, 10, 1, 1, '#86efac'));
    // 책상
    h += r(1, 20, 38, 1, '#e8b87a') + r(1, 21, 38, 2, '#d9a066') + r(2, 23, 36, 6, '#a8713a') + r(2, 23, 36, 1, '#8a5a2b')
      + r(26, 25, 9, 3, '#8a5a2b') + r(30, 26, 1, 1, '#e8b87a') + r(3, 29, 3, 1, '#6b4a2f') + r(34, 29, 3, 1, '#6b4a2f');
    h += r(X - 1, 20, 12, 1, '#94a3b8') + r(X - 1, 21, 12, 1, '#cbd5e1');         // 자판
    h += propSvg(s.prop);
    if (s.prop !== 'papers' && s.prop !== 'box' && s.prop !== 'chart' && s.prop !== 'server') { /* 소품이 작은 자리는 그대로 */ }
    h += g('hand hl', r(X - 1, 18, 2, 2, s.shirt) + r(X, 19, 2, 2, s.skin)) + g('hand hr', r(X + 9, 18, 2, 2, s.shirt) + r(X + 8, 19, 2, 2, s.skin));
    // 졸 때 Z
    h += g('zzz', g('z1', r(31, 7, 3, 1, '#334155') + r(33, 8, 1, 1, '#334155') + r(32, 9, 1, 1, '#334155') + r(31, 10, 3, 1, '#334155'))
      + g('z2', r(34, 0, 5, 1, '#334155') + r(37, 1, 1, 1, '#334155') + r(36, 2, 1, 1, '#334155') + r(35, 3, 1, 1, '#334155') + r(34, 4, 5, 1, '#334155')));
    h += g('spark', r(32, 4, 1, 3, '#f59e0b') + r(31, 5, 3, 1, '#f59e0b') + r(15, 3, 1, 1, '#f59e0b') + r(36, 9, 1, 1, '#f59e0b'));
    return svg(40, 30, 4, h);
  }

  function bossSvg(papers) {
    const s = { skin: '#f2c9a0', hair: '#1f2937', style: 'short' };
    const X = 24;
    let h = '';
    h += r(21, 6, 16, 16, '#7f1d1d') + r(22, 7, 14, 14, '#991b1b');               // 큰 의자
    h += r(X + 4, 13, 2, 1, s.skin);
    h += r(X - 2, 14, 14, 8, '#1e293b') + r(X + 3, 14, 4, 3, '#fff') + r(X + 4, 15, 2, 5, '#dc2626');   // 정장 · 넥타이
    h += headSvg(s, X);
    // 넓은 책상
    h += r(2, 21, 54, 1, '#c98a52') + r(2, 22, 54, 2, '#b3743c') + r(3, 24, 52, 7, '#7a4a23') + r(3, 24, 52, 1, '#5f3819')
      + r(8, 26, 12, 3, '#5f3819') + r(38, 26, 12, 3, '#5f3819') + r(13, 27, 2, 1, '#e8b87a') + r(43, 27, 2, 1, '#e8b87a') + r(4, 31, 4, 1, '#4a2c14') + r(50, 31, 4, 1, '#4a2c14');
    // 확인할 서류 더미(대기 수만큼, 최대 5장)
    for (let i = 0; i < papers; i++) h += r(8, 20 - i * 2, 9, 2, '#fff') + r(8, 21 - i * 2, 9, 1, '#cbd5e1') + r(9, 20 - i * 2, 2, 1, '#ef4444');
    h += r(41, 16, 7, 5, OUT) + r(42, 17, 5, 3, '#1e3a5f') + r(44, 21, 1, 1, OUT);   // 작은 화면
    h += r(X + 1, 20, 3, 2, s.skin) + g('bhand', r(X + 6, 20, 3, 2, s.skin));        // 손(한 손은 책상을 톡톡)
    h += g('leaf', r(51, 11, 3, 8, '#15803d') + r(49, 13, 2, 3, '#16a34a') + r(54, 12, 2, 4, '#16a34a')) + r(52, 16, 1, 3, '#15803d') + r(50, 18, 5, 3, '#9a5b2e');   // 화분
    return svg(58, 32, 4, h);
  }

  function wallArt() {
    let h = '';
    // 창문(왼쪽)
    h += '<svg class="px" style="left:10px" viewBox="0 0 22 16" width="88" height="64" shape-rendering="crispEdges" aria-hidden="true">'
      + r(0, 1, 22, 13, OUT) + r(1, 2, 20, 11, '#bae6fd') + r(1, 9, 20, 4, '#7dd3fc')
      + g('cloud-a', r(4, 4, 6, 2, '#fff') + r(5, 3, 3, 1, '#fff')) + r(14, 6, 5, 1, '#fff') + r(10, 2, 1, 11, OUT) + r(0, 14, 22, 1, '#6b4a2f') + '</svg>';
    // 타일 견본 선반(오른쪽)
    h += '<svg class="px" style="right:10px" viewBox="0 0 22 16" width="88" height="64" shape-rendering="crispEdges" aria-hidden="true">'
      + r(1, 3, 4, 4, '#fca5a5') + r(6, 3, 4, 4, '#e7e5e4') + r(11, 3, 4, 4, '#93c5fd') + r(16, 3, 4, 4, '#a8a29e')
      + r(0, 7, 22, 1, '#6b4a2f')
      + r(1, 9, 4, 4, '#fde68a') + r(6, 9, 4, 4, '#86efac') + r(11, 9, 4, 4, '#d6d3d1') + r(16, 9, 4, 4, '#c4b5fd')
      + r(0, 13, 22, 1, '#6b4a2f') + r(2, 4, 1, 1, '#fff') + r(12, 4, 1, 1, '#fff') + r(7, 10, 1, 1, '#fff') + '</svg>';
    // 벽시계(창문 옆) — 추가 좌우로
    h += '<svg class="px" style="left:106px;bottom:14px" viewBox="0 0 7 12" width="28" height="48" shape-rendering="crispEdges" aria-hidden="true">'
      + r(0, 0, 7, 7, OUT) + r(1, 1, 5, 5, '#fff') + r(3, 2, 1, 2, OUT) + r(3, 3, 2, 1, OUT) + r(3, 1, 1, 1, '#ef4444', 'tick')
      + r(3, 7, 1, 2, '#6b4a2f') + g('pend', r(3, 9, 1, 1, '#6b4a2f') + r(2, 10, 3, 2, '#d97706')) + '</svg>';
    return h;
  }

  function walkerSvg() {   // 서류 나르는 작은 로봇(오른쪽을 보고 걷는다)
    let h = r(5, 0, 1, 2, '#64748b') + r(4, 0, 3, 1, '#ef4444', 'tick');
    h += r(2, 2, 8, 5, '#94a3b8') + r(2, 2, 8, 1, '#cbd5e1') + r(4, 4, 5, 2, '#0f172a') + r(5, 4, 1, 1, '#7dd3fc') + r(7, 4, 1, 1, '#7dd3fc');
    h += r(3, 7, 6, 3, '#64748b') + r(9, 7, 2, 1, '#64748b');
    h += r(10, 5, 2, 3, '#fff') + r(10, 5, 2, 1, '#cbd5e1') + r(10, 7, 1, 1, '#ef4444');   // 들고 가는 서류
    h += g('leg-a', r(3, 10, 2, 1, '#334155') + r(7, 10, 2, 1, '#334155')) + g('leg-b', r(4, 10, 2, 1, '#334155') + r(8, 10, 2, 1, '#334155'));
    return svg(12, 11, 3, h);
  }

  // ---------- 자료 ----------
  const view = {
    owner: { state: 'loading', count: 0 },             // loading | ok | fail
    office: { state: 'loading', data: null },          // loading | ok | notready(서버에 아직 기능 없음) | fail
    loadedAt: 0
  };

  async function call(payload) {
    const res = await fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(payload) });
    return res.json();
  }

  function kst(s) {   // 'yyyy-MM-dd HH:mm:ss'(한국 시간) → 밀리초
    const t = new Date(String(s || '').replace(' ', 'T') + '+09:00').getTime();
    return isNaN(t) ? 0 : t;
  }

  // 직원 한 명의 지금 상태: { kind: work|done|idle|fail, text }
  function statusOf(id) {
    const o = view.office;
    if (o.state === 'loading') return { kind: 'idle', text: '불러오는 중' };
    if (o.state === 'fail') return { kind: 'fail', text: '확인 실패' };
    if (o.state !== 'ok') return { kind: 'idle', text: '대기' };
    const last = (o.data.latest || {})[id];
    if (!last) return { kind: 'idle', text: '대기' };
    const now = kst(o.data.now) + (Date.now() - view.loadedAt);   // 서버 시계 기준 + 불러온 뒤 흐른 시간
    const at = kst(last.at);
    const min = at ? (now - at) / 60000 : Infinity;
    if (last.state === '시작' && min < WORK_MAX_MIN) return { kind: 'work', text: last.text || '일하는 중' };
    if (last.state === '끝' && min < DONE_SHOW_MIN) return { kind: 'done', text: '방금 끝냄' + (last.text ? ' · ' + last.text : '') };
    return { kind: 'idle', text: '대기' };
  }

  function renderDesks() {
    STAFF.forEach(function (s) {
      const el = document.getElementById('desk-' + s.id);
      const st = statusOf(s.id);
      el.className = 'desk is-' + st.kind;
      el.querySelector('.t').textContent = st.text;
      el.setAttribute('aria-label', s.name + ' — ' + st.text);
    });
  }

  function renderOwner() {
    const badge = document.getElementById('bossBadge');
    const o = view.owner;
    let papers = 0;
    if (o.state === 'ok') {
      badge.textContent = o.count > 0 ? '대표님 확인 ' + o.count + '건' : '확인할 것 없음';
      badge.className = 'badge' + (o.count > 0 ? ' red' : '');
      papers = Math.min(5, o.count);
    } else if (o.state === 'fail') {
      badge.textContent = '대표님 확인 — 확인 실패';
      badge.className = 'badge bad';
    } else {
      badge.textContent = '대표님 확인 불러오는 중';
      badge.className = 'badge';
    }
    const art = document.getElementById('bossArt');
    if (art.getAttribute('data-papers') !== String(papers)) {
      art.innerHTML = bossSvg(papers);
      art.setAttribute('data-papers', String(papers));
    }
  }

  function renderSlips() {
    const o = view.office;
    [['saleCount', 'sale'], ['purchaseCount', 'purchase']].forEach(function (p) {
      const el = document.getElementById(p[0]);
      const slips = o.state === 'ok' && o.data.slips;
      const n = slips ? Number(slips[p[1]]) : NaN;
      if (o.state === 'loading') { el.textContent = '불러오는 중'; el.className = 'soft'; }
      else if (o.state === 'fail') { el.textContent = '확인 실패'; el.className = 'bad'; }
      else if (slips && slips.ready === true && isFinite(n) && n >= 0) { el.textContent = n + '건'; el.className = ''; }
      else { el.textContent = '준비 중'; el.className = 'soft'; }
    });
  }

  function renderAll() { renderOwner(); renderSlips(); renderDesks(); if (openId) renderSheet(openId); }

  let loading = false;
  async function load() {
    if (loading) return;
    loading = true;
    const lastLoad = document.getElementById('lastLoad');
    const jobs = [
      call({ action: 'owner_check_list', status: '대기' }).then(function (d) {
        if (d && d.ok && Array.isArray(d.items)) view.owner = { state: 'ok', count: d.items.length };   // 개수만 쓴다
        else view.owner = { state: 'fail', count: 0 };
      }, function () { view.owner = { state: 'fail', count: 0 }; }),
      call({ action: 'office_log_recent', limit: 60 }).then(function (d) {
        if (d && d.ok && d.latest && typeof d.latest === 'object') view.office = { state: 'ok', data: d };
        else if (d && !d.needKey && /알 수 없는/.test(String(d.error || ''))) view.office = { state: 'notready', data: null };   // 서버에 아직 배포 전
        else view.office = { state: 'fail', data: null };
      }, function () { view.office = { state: 'fail', data: null }; })
    ];
    await Promise.all(jobs);
    view.loadedAt = Date.now();
    loading = false;
    renderAll();
    const t = new Date();
    const hm = t.getHours() + ':' + String(t.getMinutes()).padStart(2, '0');
    const bad = view.owner.state === 'fail' || view.office.state === 'fail';
    lastLoad.textContent = (bad ? '일부를 불러오지 못했어요 · ' : '') + '마지막 확인 ' + hm + ' · 5분마다 자동';
    lastLoad.className = bad ? 'err' : '';
  }

  // ---------- 책상을 눌렀을 때 ----------
  let openId = '';
  function renderSheet(id) {
    const s = STAFF.filter(function (x) { return x.id === id; })[0];
    if (!s) return;
    const st = statusOf(id);
    const label = { work: '일하는 중', done: '방금 끝냄', idle: '대기', fail: '확인 실패' }[st.kind];
    let h = '<h2>' + esc(s.name) + (s.tag ? ' <small style="font-size:12px;color:#64748b;font-weight:600">' + esc(s.tag) + '</small>' : '') + '</h2>';
    h += '<span class="st ' + st.kind + '">' + esc(label) + '</span>';
    h += '<p class="job">' + esc(s.job) + '</p>';
    h += '<h3>최근 기록</h3>';
    const o = view.office;
    if (o.state === 'ok') {
      const mine = (o.data.recent || []).filter(function (x) { return x.staff === id; }).slice(0, MODAL_LINES);
      if (mine.length) {
        h += '<ul>' + mine.map(function (x) {
          const at = String(x.at || '');
          return '<li><span class="when">' + esc(at.slice(5, 7) + '/' + at.slice(8, 10) + ' ' + at.slice(11, 16)) + '</span>'
            + '<span class="what"><b>' + esc(x.state) + '</b>' + esc(x.text) + '</span></li>';
        }).join('') + '</ul>';
      } else h += '<div class="none">아직 남긴 기록이 없어요.</div>';
    } else if (o.state === 'fail') h += '<div class="none">기록을 불러오지 못했어요. 잠시 뒤 「새로고침」을 눌러 주세요.</div>';
    else if (o.state === 'loading') h += '<div class="none">불러오는 중...</div>';
    else h += '<div class="none">활동 기록은 준비 중이에요.</div>';
    h += '<button type="button" class="close" id="sheetClose">닫기</button>';
    document.getElementById('sheet').innerHTML = h;
  }
  function openSheet(id) { openId = id; renderSheet(id); document.getElementById('sheetBg').classList.add('on'); }
  function closeSheet() { openId = ''; document.getElementById('sheetBg').classList.remove('on'); }

  // ---------- 처음 그리기 ----------
  document.getElementById('wall').insertAdjacentHTML('beforeend', wallArt());
  document.getElementById('walker').innerHTML = walkerSvg();
  document.getElementById('desks').innerHTML = STAFF.map(function (s) {
    return '<button type="button" class="desk is-idle" id="desk-' + s.id + '" data-id="' + s.id + '" style="--sp:' + s.sp + ';--dl:-' + s.dl + 's">'
      + '<span class="bubble"><span class="t">불러오는 중</span></span>' + deskSvg(s)
      + '<span class="plate">' + esc(s.name) + (s.tag ? '<small>' + esc(s.tag) + '</small>' : '') + '</span></button>';
  }).join('');
  renderAll();

  document.getElementById('desks').addEventListener('click', function (e) {
    const d = e.target.closest('.desk');
    if (d) openSheet(d.getAttribute('data-id'));
  });
  document.getElementById('sheetBg').addEventListener('click', function (e) {
    if (e.target.id === 'sheetBg' || e.target.id === 'sheetClose') closeSheet();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
  document.getElementById('refreshBtn').addEventListener('click', load);
  document.addEventListener('visibilitychange', function () {
    if (!document.hidden && Date.now() - view.loadedAt > REFRESH_MS) load();
  });
  setInterval(function () { if (!document.hidden) load(); }, REFRESH_MS);
  setInterval(function () { if (!document.hidden && view.loadedAt) renderAll(); }, RETHINK_MS);
  load();
</script>
</body>
</html>
