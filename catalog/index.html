<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>히트타일 시공사진 카탈로그</title>
<style>
  :root{
    --bg:#F1EFE8; --surface:#FFFFFF; --border:#D8D4CC; --border-strong:#B4B2A9;
    --text:#2C2C2A; --text-secondary:#5F5E5A; --text-muted:#888780;
    --accent-bg:#FAEEDA; --accent-border:#BA7517; --accent-text:#633806;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,"Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:4rem;
  }
  header{
    padding:1.5rem 1.25rem 1rem; background:var(--surface); border-bottom:1px solid var(--border);
  }
  header h1{font-size:20px; font-weight:600; margin:0 0 2px;}
  header p{font-size:13px; color:var(--text-muted); margin:0;}
  main{max-width:1000px; margin:0 auto; padding:1.25rem;}
  .search-row{display:flex; gap:10px; margin-bottom:1rem;}
  .search-wrap{position:relative; flex:1;}
  .search-wrap input{
    width:100%; height:48px; padding:0 16px 0 42px; font-size:16px;
    border:1px solid var(--border-strong); border-radius:10px; background:var(--surface);
  }
  .search-wrap svg{position:absolute; left:14px; top:50%; transform:translateY(-50%);}
  #qrBtn{
    height:48px; padding:0 18px; border-radius:10px; border:1px solid var(--border-strong);
    background:var(--surface); font-size:15px; cursor:pointer; display:flex; align-items:center; gap:8px;
    white-space:nowrap;
  }
  #qrBtn:active{transform:scale(0.98);}
  .filter-group{margin-bottom:0.9rem;}
  .filter-label{font-size:13px; color:var(--text-secondary); margin:0 0 6px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    padding:9px 16px; border-radius:20px; border:1px solid var(--border-strong);
    background:var(--surface); font-size:14px; cursor:pointer; user-select:none;
  }
  .chip:active{transform:scale(0.97);}
  .chip.active{background:var(--accent-bg); border-color:var(--accent-border); color:var(--accent-text);}
  #resultCount{font-size:13px; color:var(--text-muted); margin:1rem 0 8px;}
  #grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;}
  .card{
    border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--surface);
  }
  .card .photo{
    width:100%; aspect-ratio:1/1; object-fit:cover; background:#E4E1D6; display:block;
  }
  .card .meta{padding:10px 12px;}
  .card .num{font-size:14px; font-weight:600; margin:0 0 2px;}
  .card .sub{font-size:12px; color:var(--text-secondary); margin:0;}
  .empty{grid-column:1/-1; text-align:center; padding:2.5rem 0; color:var(--text-muted); font-size:14px;}
  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5);
    align-items:center; justify-content:center; z-index:50; padding:1rem;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:var(--surface); border-radius:14px; padding:1.75rem; text-align:center;
    max-width:300px; width:100%;
  }
  .modal h2{font-size:16px; font-weight:600; margin:0 0 6px;}
  .modal p{font-size:13px; color:var(--text-secondary); margin:0 0 16px;}
  #qrcode{display:flex; justify-content:center; margin-bottom:16px;}
  .modal button{
    width:100%; height:44px; border-radius:10px; border:1px solid var(--border-strong);
    background:var(--bg); font-size:14px; cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <h1>히트타일 시공사진 카탈로그</h1>
  <p>타일 넘버·색상·사이즈로 검색하세요</p>
</header>

<main>
  <div class="search-row">
    <div class="search-wrap">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888780" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input id="numSearch" type="text" placeholder="타일 넘버 검색 (예: HT-1024)">
    </div>
    <button id="qrBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><line x1="14" y1="14" x2="14" y2="21"/><line x1="21" y1="14" x2="21" y2="21"/><line x1="14" y1="21" x2="21" y2="21"/></svg>
      QR
    </button>
  </div>

  <div class="filter-group">
    <p class="filter-label">사이즈</p>
    <div class="chips" id="sizeChips"></div>
  </div>

  <div class="filter-group">
    <p class="filter-label">색상 태그</p>
    <div class="chips" id="colorChips"></div>
  </div>

  <div class="filter-group">
    <p class="filter-label">공간</p>
    <div class="chips" id="roomChips"></div>
  </div>

  <p id="resultCount"></p>
  <div id="grid"></div>
</main>

<div class="modal-overlay" id="qrModal">
  <div class="modal">
    <h2>고객 휴대폰으로 계속 보기</h2>
    <p>지금 화면의 검색 결과를 그대로 스캔해서 휴대폰으로 이어볼 수 있습니다.</p>
    <div id="qrcode"></div>
    <button id="closeQr">닫기</button>
  </div>
</div>

<div class="modal-overlay" id="photoModal">
  <div class="modal" style="max-width:90vw;padding:1rem;">
    <div style="position:relative;">
      <img id="photoModalImg" src="" alt="" style="max-width:100%;max-height:80vh;border-radius:10px;display:block;margin:0 auto;">
      <button id="prevPhoto" aria-label="이전 사진" style="display:none;position:absolute;left:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:none;background:rgba(0,0,0,0.5);color:#fff;font-size:18px;cursor:pointer;align-items:center;justify-content:center;">‹</button>
      <button id="nextPhoto" aria-label="다음 사진" style="display:none;position:absolute;right:6px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:50%;border:none;background:rgba(0,0,0,0.5);color:#fff;font-size:18px;cursor:pointer;align-items:center;justify-content:center;">›</button>
    </div>
    <p id="photoModalCaption" style="margin:10px 0 0;font-size:14px;font-weight:600;"></p>
    <button id="closePhoto" style="margin-top:12px;width:100%;height:44px;border-radius:10px;border:1px solid var(--border-strong);background:var(--bg);font-size:14px;cursor:pointer;">닫기</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
/* ============================================================
   설정: 구글 스프레드시트를 "웹에 게시 > CSV" 한 링크를 아래에 붙여넣으세요.
   시트 컬럼 이름은 반드시 아래와 동일하게 만들어주세요:
   넘버 | 사이즈 | 색상태그 | 공간 | 사진링크
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQgE_L-8dwsI0dR17jd3FMvZY7VdoL1WOYSkLlBwprxexHQ_A9hWl4k5V8Im2Ja7qVcmhkJ9l_JoV7a/pub?output=csv";

/* 시트 연동 전 테스트용 샘플 데이터 (연동되면 자동으로 무시됩니다) */
const SAMPLE_DATA = [
  {num:"HT-1024", size:"300x600", color:"베이지", room:"욕실", image:""},
  {num:"HT-1025", size:"300x600", color:"화이트", room:"욕실", image:""},
  {num:"HT-2031", size:"600x600", color:"그레이", room:"거실", image:""},
  {num:"HT-2032", size:"600x600", color:"베이지", room:"주방", image:""},
  {num:"HT-2033", size:"600x600", color:"블랙",  room:"욕실", image:""},
  {num:"HT-3041", size:"600x1200", color:"그레이", room:"거실", image:""},
  {num:"HT-3042", size:"600x1200", color:"우드톤", room:"거실", image:""},
  {num:"HT-4051", size:"800x800", color:"베이지", room:"거실", image:""},
  {num:"HT-4052", size:"800x800", color:"그레이", room:"주방", image:""},
  {num:"HT-5061", size:"모자이크", color:"화이트", room:"욕실", image:""},
  {num:"HT-5062", size:"모자이크", color:"우드톤", room:"주방", image:""}
];

let tiles = [];
let activeSize = null;
let activeColor = null;
let activeRoom = null;

async function loadData(){
  try{
    if(SHEET_CSV_URL.includes("PASTE_YOUR")) throw new Error("시트 미연동");
    const res = await fetch(SHEET_CSV_URL);
    const csvText = await res.text();
    const parsed = Papa.parse(csvText, {header:true, skipEmptyLines:true});
    tiles = parsed.data.map(row => ({
      num: (row["넘버"]||"").trim(),
      size: (row["사이즈"]||"").trim(),
      color: (row["색상태그"]||"").trim(),
      room: (row["공간"]||"").trim(),
      image: (row["사진링크"]||"").trim()
    })).filter(t => t.num);
  }catch(e){
    console.warn("구글 시트 연동 전이라 샘플 데이터를 표시합니다.", e);
    tiles = SAMPLE_DATA;
  }
  applyStateFromURL();
  buildFilters();
  render();
}

function buildFilters(){
  const sizes = [...new Set(tiles.map(t=>t.size))].filter(Boolean);
  const colors = [...new Set(tiles.map(t=>t.color))].filter(Boolean);
  const rooms = [...new Set(tiles.map(t=>t.room))].filter(Boolean);

  const sizeChipsEl = document.getElementById("sizeChips");
  sizeChipsEl.innerHTML = "";
  sizes.forEach(s=>{
    const el = document.createElement("div");
    el.className = "chip" + (activeSize===s ? " active" : "");
    el.textContent = s;
    el.addEventListener("click", ()=>{
      activeSize = activeSize===s ? null : s;
      buildFilters(); render(); syncURL();
    });
    sizeChipsEl.appendChild(el);
  });

  const colorChipsEl = document.getElementById("colorChips");
  colorChipsEl.innerHTML = "";
  colors.forEach(c=>{
    const el = document.createElement("div");
    el.className = "chip" + (activeColor===c ? " active" : "");
    el.textContent = c;
    el.addEventListener("click", ()=>{
      activeColor = activeColor===c ? null : c;
      buildFilters(); render(); syncURL();
    });
    colorChipsEl.appendChild(el);
  });

  const roomChipsEl = document.getElementById("roomChips");
  roomChipsEl.innerHTML = "";
  rooms.forEach(r=>{
    const el = document.createElement("div");
    el.className = "chip" + (activeRoom===r ? " active" : "");
    el.textContent = r;
    el.addEventListener("click", ()=>{
      activeRoom = activeRoom===r ? null : r;
      buildFilters(); render(); syncURL();
    });
    roomChipsEl.appendChild(el);
  });
}

function groupByNum(list){
  const map = new Map();
  list.forEach(t=>{
    if(!map.has(t.num)){
      map.set(t.num, {num:t.num, size:t.size, color:t.color, rooms:[], images:[]});
    }
    const g = map.get(t.num);
    if(t.room && !g.rooms.includes(t.room)) g.rooms.push(t.room);
    if(t.image) g.images.push(t.image);
  });
  return [...map.values()];
}

function render(){
  const q = document.getElementById("numSearch").value.trim().toUpperCase();
  const filtered = tiles.filter(t=>{
    if(q && !t.num.toUpperCase().includes(q)) return false;
    if(activeSize && t.size !== activeSize) return false;
    if(activeColor && t.color !== activeColor) return false;
    if(activeRoom && t.room !== activeRoom) return false;
    return true;
  });

  const groups = groupByNum(filtered);

  document.getElementById("resultCount").textContent = groups.length + "개 타일";

  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  if(groups.length === 0){
    grid.innerHTML = '<div class="empty">조건에 맞는 시공사진이 없습니다.</div>';
    return;
  }

  groups.forEach(g=>{
    const card = document.createElement("div");
    card.className = "card";

    const photoWrap = document.createElement("div");
    photoWrap.style.position = "relative";

    let activeIdx = 0;
    const hasImages = g.images.length > 0;
    const img = document.createElement(hasImages ? "img" : "div");
    img.className = "photo";
    if(hasImages){
      img.src = g.images[0];
      img.alt = g.num + " 시공사진";
      img.loading = "lazy";
      img.style.cursor = "pointer";
    }
    photoWrap.appendChild(img);

    if(g.images.length > 1){
      const dots = document.createElement("div");
      dots.style.cssText = "position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px;";
      g.images.forEach((src, i)=>{
        const dot = document.createElement("span");
        dot.style.cssText = "width:7px;height:7px;border-radius:50%;cursor:pointer;box-shadow:0 0 2px rgba(0,0,0,0.5);background:" + (i===0 ? "rgba(255,255,255,0.95)" : "rgba(255,255,255,0.5)");
        dot.addEventListener("click", (e)=>{
          e.stopPropagation();
          activeIdx = i;
          img.src = src;
          [...dots.children].forEach((d,di)=>{ d.style.background = di===i ? "rgba(255,255,255,0.95)" : "rgba(255,255,255,0.5)"; });
        });
        dots.appendChild(dot);
      });
      photoWrap.appendChild(dots);

      const countBadge = document.createElement("div");
      countBadge.textContent = g.images.length + "장";
      countBadge.style.cssText = "position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.55);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px;";
      photoWrap.appendChild(countBadge);
    }

    if(hasImages){
      img.addEventListener("click", ()=>{
        openPhotoModal(g.images, activeIdx, g.num);
      });
    }

    const meta = document.createElement("div");
    meta.className = "meta";
    const roomText = g.rooms.length ? g.rooms.join(", ") : "";
    meta.innerHTML = `<p class="num">${g.num}</p><p class="sub">${g.size}${roomText ? " · " + roomText : ""}</p>`;

    card.appendChild(photoWrap);
    card.appendChild(meta);
    grid.appendChild(card);
  });
}

function syncURL(){
  const params = new URLSearchParams();
  const q = document.getElementById("numSearch").value.trim();
  if(q) params.set("num", q);
  if(activeSize) params.set("size", activeSize);
  if(activeColor) params.set("color", activeColor);
  if(activeRoom) params.set("room", activeRoom);
  const newUrl = window.location.pathname + (params.toString() ? "?" + params.toString() : "");
  history.replaceState(null, "", newUrl);
}

function applyStateFromURL(){
  const params = new URLSearchParams(window.location.search);
  if(params.get("num")) document.getElementById("numSearch").value = params.get("num");
  if(params.get("size")) activeSize = params.get("size");
  if(params.get("color")) activeColor = params.get("color");
  if(params.get("room")) activeRoom = params.get("room");
}

document.getElementById("numSearch").addEventListener("input", ()=>{ render(); syncURL(); });

document.getElementById("qrBtn").addEventListener("click", ()=>{
  const modal = document.getElementById("qrModal");
  modal.classList.add("show");
  const qrEl = document.getElementById("qrcode");
  qrEl.innerHTML = "";
  new QRCode(qrEl, { text: window.location.href, width:150, height:150 });
});
document.getElementById("closeQr").addEventListener("click", ()=>{
  document.getElementById("qrModal").classList.remove("show");
});
document.getElementById("qrModal").addEventListener("click", (e)=>{
  if(e.target.id === "qrModal") e.target.classList.remove("show");
});

function closePhotoModalNow(){
  document.getElementById("photoModal").classList.remove("show");
}
document.getElementById("closePhoto").addEventListener("click", closePhotoModalNow);
document.getElementById("closePhoto").addEventListener("touchend", (e)=>{
  e.preventDefault();
  closePhotoModalNow();
});
document.getElementById("photoModal").addEventListener("click", (e)=>{
  if(e.target.id === "photoModal") closePhotoModalNow();
});
document.getElementById("photoModal").addEventListener("touchend", (e)=>{
  if(e.target.id === "photoModal"){
    e.preventDefault();
    closePhotoModalNow();
  }
});

let modalImages = [];
let modalIndex = 0;

function openPhotoModal(images, startIdx, caption){
  modalImages = images;
  modalIndex = startIdx || 0;
  document.getElementById("photoModalCaption").textContent = caption;
  updateModalImage();
  document.getElementById("photoModal").classList.add("show");
}

function updateModalImage(){
  document.getElementById("photoModalImg").src = modalImages[modalIndex];
  const multi = modalImages.length > 1;
  const prevBtn = document.getElementById("prevPhoto");
  const nextBtn = document.getElementById("nextPhoto");
  prevBtn.style.display = multi ? "flex" : "none";
  nextBtn.style.display = multi ? "flex" : "none";
}

document.getElementById("prevPhoto").addEventListener("click", (e)=>{
  e.stopPropagation();
  modalIndex = (modalIndex - 1 + modalImages.length) % modalImages.length;
  updateModalImage();
});
document.getElementById("nextPhoto").addEventListener("click", (e)=>{
  e.stopPropagation();
  modalIndex = (modalIndex + 1) % modalImages.length;
  updateModalImage();
});
document.addEventListener("keydown", (e)=>{
  if(!document.getElementById("photoModal").classList.contains("show")) return;
  if(e.key === "ArrowLeft"){ modalIndex = (modalIndex - 1 + modalImages.length) % modalImages.length; updateModalImage(); }
  if(e.key === "ArrowRight"){ modalIndex = (modalIndex + 1) % modalImages.length; updateModalImage(); }
  if(e.key === "Escape"){ document.getElementById("photoModal").classList.remove("show"); }
});

loadData();
</script>
</body>
</html>
