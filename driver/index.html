<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>히트타일 배송기사</title>
<style>
  :root{
    --bg:#f5f6f8;
    --ink:#1a1a1a;
    --muted:#6b7280;
    --line:rgba(17,17,17,0.09);
    --brass:#2563eb;
    --brass-deep:#1d4ed8;
    --ok:#16803c;
    --warn:#b0824f;
    --err:#b1503f;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:0 0 60px;
  }
  header{
    padding:32px 6vw 20px;
    border-bottom:1px solid var(--line);
  }
  header h1{ margin:0 0 6px; font-size:22px; }
  header p{ margin:0; color:var(--muted); font-size:13px; }

  main{ max-width:560px; margin:0 auto; padding:24px 6vw 0; }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:18px 18px 20px;
    margin-bottom:20px;
  }

  /* ---- day nav ---- */
  .day-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .day-nav .title{
    font-size:16px; font-weight:700;
    cursor:ns-resize;
    -webkit-user-select:none; user-select:none;
    touch-action:none;
    padding:4px 6px;
    margin:-4px -6px;
    border-radius:6px;
    display:inline-block;
  }
  .day-nav .title.dragging{ background:#eef2ff; color:var(--brass-deep); }
  .day-nav .drag-hint{ display:block; font-size:10.5px; color:var(--muted); font-weight:400; margin-top:1px; }
  .day-nav-btns{ display:flex; gap:6px; }
  .day-nav-btns button{
    padding:0 12px;
    height:32px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
    font-size:13px;
    font-family:inherit;
  }
  .day-nav-btns button:hover{ border-color:var(--brass); color:var(--brass-deep); }

  .cnt{ color:var(--muted); font-size:12.5px; font-weight:500; margin-left:6px; }

  .order-list{ display:flex; flex-direction:column; gap:10px; }
  .empty, .loading, .error-box{ padding:30px 10px; text-align:center; color:var(--muted); font-size:13.5px; }
  .error-box{ color:var(--err); }

  .order-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .order-summary{ padding:16px; }

  .status-line{ font-size:13.5px; margin-bottom:12px; }
  .status-line .main{ font-weight:700; color:var(--ink); }
  .status-line .sep{ color:var(--muted); margin:0 5px; }
  .status-line .sub{ font-weight:600; }
  .status-line .sub.ok{ color:var(--ok); }
  .status-line .sub.warn{ color:var(--warn); }
  .status-line .sub.err{ color:var(--err); }
  .status-line .sub.muted{ color:var(--muted); }

  .order-body{ display:flex; gap:12px; align-items:center; margin-bottom:14px; }
  .order-thumb{
    width:52px; height:52px;
    border-radius:12px;
    background:#eef2ff;
    color:var(--brass);
    display:flex; align-items:center; justify-content:center;
    font-size:17px; font-weight:700;
    flex-shrink:0;
  }
  .order-info{ flex:1; min-width:0; }
  .order-info .vendor{ font-size:16px; font-weight:700; }
  .order-info .site{ font-size:12.5px; color:var(--muted); margin-left:6px; font-weight:400; }
  .phone{ font-size:12.5px; color:var(--muted); margin-top:4px; }

  .badges{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px; }
  .badge{
    font-size:11px;
    font-weight:600;
    padding:3px 8px;
    border-radius:999px;
    white-space:nowrap;
  }
  .badge.ok{ background:rgba(22,128,60,0.10); color:var(--ok); }
  .badge.warn{ background:rgba(176,130,79,0.14); color:var(--warn); }
  .badge.err{ background:rgba(177,80,63,0.12); color:var(--err); }
  .badge.muted{ background:rgba(17,17,17,0.07); color:var(--muted); }

  .order-actions{ display:flex; gap:8px; }
  .oa-btn{
    flex:1;
    padding:10px;
    border-radius:9px;
    font-size:13px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
    text-align:center;
  }
  .oa-outline{ border:1px solid var(--line); background:var(--card); color:var(--ink); }
  .oa-outline:hover{ border-color:var(--brass); color:var(--brass-deep); }
  .oa-primary{ border:1px solid rgba(37,99,235,0.3); background:#eef2ff; color:var(--brass); }
  .oa-primary:hover{ background:#e0e7ff; }

  .order-detail{
    display:none;
    border-top:1px solid var(--line);
    padding:16px;
    background:#f5f6f8;
  }
  .order-detail.show{ display:block; }

  .lock-box{
    text-align:center;
    padding:22px 10px;
    color:var(--muted);
    font-size:13.5px;
    line-height:1.6;
  }
  .lock-box .icon{ font-size:22px; display:block; margin-bottom:8px; }

  .detail-section h3{
    font-size:12px;
    color:var(--muted);
    margin:0 0 10px;
    font-weight:700;
    letter-spacing:0.02em;
    text-transform:uppercase;
  }

  .check-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
    font-size:14.5px;
    border:1px solid var(--line);
    border-radius:11px;
    margin-bottom:8px;
    background:var(--card);
    cursor:pointer;
    user-select:none;
    transition:background .12s ease, border-color .12s ease;
    flex-wrap:wrap;
  }
  .check-row:last-of-type{ margin-bottom:0; }
  .check-row:hover{ border-color:var(--brass); }
  .check-row:focus-visible{ outline:2px solid var(--brass); outline-offset:1px; }
  .check-row.done{ background:rgba(92,122,94,0.10); border-color:rgba(92,122,94,0.4); }
  .check-row .itnm{ flex:1; min-width:0; }
  .check-row .qty-display{
    min-width:38px;
    text-align:center;
    padding:7px 10px;
    border-radius:8px;
    background:rgba(17,17,17,0.07);
    color:var(--ink);
    font-weight:700;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
  }
  .check-row.done .qty-display{ background:var(--ok); color:#fff; }
  .check-row input.qty-input{
    width:64px;
    padding:7px 8px;
    border:1px solid var(--brass);
    border-radius:7px;
    font-size:14px;
    text-align:right;
    font-family:inherit;
    color:var(--ink);
    background:var(--card);
  }
  .check-row input.qty-input:focus{ outline:none; border-color:var(--brass); }
  .check-row .shortfall-tag{ font-size:11px; color:var(--err); font-weight:600; }
  .check-row .cst{ font-size:10.5px; color:var(--muted); flex-basis:100%; text-align:right; }

  .form-actions{ display:flex; gap:8px; margin-top:14px; }
  .form-actions button{
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    padding:10px 14px;
    border-radius:8px;
    cursor:pointer;
    flex:1;
  }
  .btn-primary{ border:none; background:var(--brass); color:#fff; }
  .btn-primary:hover{ background:var(--brass-deep); }
  .btn-primary:disabled{ background:#d1d5db; cursor:default; }
  .btn-ghost{ border:1px solid var(--line); background:var(--card); color:var(--muted); }
  .btn-ghost:hover{ border-color:var(--brass); color:var(--brass-deep); }

  .section-msg{ font-size:12px; margin-top:8px; min-height:14px; color:var(--muted); }
  .section-msg.err{ color:var(--err); }
  .section-msg.ok{ color:var(--ok); }
</style>
</head>
<body>

<header>
  <h1>히트타일 배송기사</h1>
  <p>오늘 배송할 현장을 확인하고, 전달한 품목을 체크해주세요.</p>
</header>

<main>

  <div class="card">
    <div class="day-nav">
      <div>
        <span class="title" id="dayTitle"></span>
        <span class="cnt" id="dayCount"></span>
        <span class="drag-hint">날짜를 누른 채 위아래로 끌면 날짜가 바뀌어요</span>
      </div>
      <div class="day-nav-btns">
        <button type="button" id="prevDay" aria-label="전날">‹</button>
        <button type="button" id="todayBtn">오늘</button>
        <button type="button" id="nextDay" aria-label="다음날">›</button>
      </div>
    </div>
  </div>

  <div class="order-list" id="orderList">
    <div class="loading">불러오는 중...</div>
  </div>

</main>

<script>
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzx_vaUy7Ar1mqidKErG2WYcwNZpL6FGsfI8JNR0nILnSW9hf4bJ_N8aJmDM8J0DOKWwQ/exec';

  function pad2(n){ return String(n).padStart(2, '0'); }
  function toDateStr(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  const today = new Date();
  let selectedDate = toDateStr(today);
  let dayOrders = [];
  let expandedOrderId = null;
  let checkDrafts = {}; // orderId -> deliveredNames[]

  const dayTitle = document.getElementById('dayTitle');
  const dayCount = document.getElementById('dayCount');
  const orderList = document.getElementById('orderList');

  function updateDayHeading() {
    const parts = selectedDate.split('-').map(Number);
    const d = new Date(parts[0], parts[1] - 1, parts[2]);
    const dow = ['일', '월', '화', '수', '목', '금', '토'][d.getDay()];
    dayTitle.textContent = (d.getMonth() + 1) + '월 ' + d.getDate() + '일 (' + dow + ')';
    dayCount.textContent = dayOrders.length ? '배송 ' + dayOrders.length + '건' : '';
  }

  async function loadDayOrders() {
    updateDayHeading();
    orderList.innerHTML = '<div class="loading">불러오는 중...</div>';
    expandedOrderId = null;
    checkDrafts = {};
    try {
      const res = await fetch(ENDPOINT + '?action=delivery_by_date&date=' + selectedDate);
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '불러오지 못했어요.');
      dayOrders = data.orders || [];
      updateDayHeading();
      renderOrders();
    } catch (err) {
      orderList.innerHTML = '<div class="error-box">' + (err.message || String(err)) + '</div>';
    }
  }

  document.getElementById('prevDay').addEventListener('click', () => {
    const parts = selectedDate.split('-').map(Number);
    const d = new Date(parts[0], parts[1] - 1, parts[2] - 1);
    selectedDate = toDateStr(d);
    loadDayOrders();
  });
  document.getElementById('nextDay').addEventListener('click', () => {
    const parts = selectedDate.split('-').map(Number);
    const d = new Date(parts[0], parts[1] - 1, parts[2] + 1);
    selectedDate = toDateStr(d);
    loadDayOrders();
  });
  document.getElementById('todayBtn').addEventListener('click', () => {
    selectedDate = toDateStr(today);
    loadDayOrders();
  });

  // ---- 날짜 제목을 누른 채 위아래로 드래그하면 날짜가 바뀜 (일정 픽셀마다 하루씩) ----
  const DRAG_STEP_PX = 36;
  let dragStartY = null;
  let dragBaseDate = null;
  let dragSteps = 0;
  let dragLoadTimer = null;

  function scheduleDragLoad(immediate) {
    clearTimeout(dragLoadTimer);
    if (immediate) { loadDayOrders(); return; }
    dragLoadTimer = setTimeout(loadDayOrders, 150);
  }

  dayTitle.addEventListener('pointerdown', (e) => {
    dragStartY = e.clientY;
    const parts = selectedDate.split('-').map(Number);
    dragBaseDate = new Date(parts[0], parts[1] - 1, parts[2]);
    dragSteps = 0;
    dayTitle.classList.add('dragging');
    dayTitle.setPointerCapture(e.pointerId);
  });
  dayTitle.addEventListener('pointermove', (e) => {
    if (dragStartY === null) return;
    const dy = dragStartY - e.clientY; // 위로 끌면 양수 -> 다음 날짜로
    const steps = Math.trunc(dy / DRAG_STEP_PX);
    if (steps === dragSteps) return;
    dragSteps = steps;
    const d = new Date(dragBaseDate.getFullYear(), dragBaseDate.getMonth(), dragBaseDate.getDate() + steps);
    const newDateStr = toDateStr(d);
    if (newDateStr === selectedDate) return;
    selectedDate = newDateStr;
    updateDayHeading();
    scheduleDragLoad(false);
  });
  function endDrag() {
    if (dragStartY === null) return;
    dragStartY = null;
    dayTitle.classList.remove('dragging');
    clearTimeout(dragLoadTimer);
    if (dragSteps !== 0) scheduleDragLoad(true);
  }
  dayTitle.addEventListener('pointerup', endDrag);
  dayTitle.addEventListener('pointercancel', endDrag);

  function statusBadge(text, kind) {
    const span = document.createElement('span');
    span.className = 'badge ' + kind;
    span.textContent = text;
    return span;
  }

  function paymentBadge(order) {
    if (order.paymentStatus === '완납') return statusBadge('입금완납', 'ok');
    if (order.paymentStatus === '추후입금') return statusBadge('추후입금', 'warn');
    return statusBadge('입금확인전', 'muted');
  }

  function deliveryBadge(order) {
    const s = order.deliveryStatus || '대기';
    if (s === '완료') return statusBadge('배송완료', 'ok');
    if (s === '일부누락') return statusBadge('일부누락', 'err');
    if (s === '진행중') return statusBadge('배송진행중', 'warn');
    return statusBadge('배송대기', 'muted');
  }

  function orderStageInfo(order) {
    if (!order.invoiceRegistered) {
      return { main: '전표 미등록', sub: '사무실 확인 필요', subClass: 'muted' };
    }
    const paymentConfirmed = order.paymentStatus === '완납' || order.paymentStatus === '추후입금';
    if (!paymentConfirmed) {
      return { main: '입금 확인 전', sub: '대기 중', subClass: 'muted' };
    }
    const ds = order.deliveryStatus || '대기';
    if (ds === '완료') return { main: '배송완료', sub: order.paymentStatus, subClass: 'ok' };
    if (ds === '일부누락') return { main: '일부누락', sub: '재배송 필요', subClass: 'err' };
    if (ds === '진행중') return { main: '배송 진행중', sub: order.paymentStatus, subClass: 'warn' };
    return { main: '배송대기', sub: order.paymentStatus, subClass: 'ok' };
  }

  function orderCtaLabel(order) {
    if (!order.invoiceRegistered) return '상세보기';
    const paymentConfirmed = order.paymentStatus === '완납' || order.paymentStatus === '추후입금';
    if (!paymentConfirmed) return '상세보기';
    const ds = order.deliveryStatus || '대기';
    if (ds !== '완료') return '배송 체크하기';
    return '상세보기';
  }

  function renderOrders() {
    orderList.innerHTML = '';
    if (!dayOrders.length) {
      orderList.innerHTML = '<div class="empty">이 날짜에 등록된 배송 건이 없어요.</div>';
      return;
    }
    dayOrders.forEach((order) => {
      orderList.appendChild(buildOrderCard(order));
    });
  }

  function buildOrderCard(order) {
    const card = document.createElement('div');
    card.className = 'order-card';

    const summary = document.createElement('div');
    summary.className = 'order-summary';

    const stage = orderStageInfo(order);
    const statusLine = document.createElement('div');
    statusLine.className = 'status-line';
    statusLine.innerHTML =
      '<span class="main">' + stage.main + '</span>' +
      '<span class="sep">·</span>' +
      '<span class="sub ' + stage.subClass + '">' + stage.sub + '</span>';
    summary.appendChild(statusLine);

    const body = document.createElement('div');
    body.className = 'order-body';

    const thumb = document.createElement('div');
    thumb.className = 'order-thumb';
    thumb.textContent = (order.vendorName || '?').trim().charAt(0) || '?';
    body.appendChild(thumb);

    const info = document.createElement('div');
    info.className = 'order-info';
    const nameWrap = document.createElement('div');
    const vendorEl = document.createElement('span');
    vendorEl.className = 'vendor';
    vendorEl.textContent = order.vendorName || '(업체명 없음)';
    nameWrap.appendChild(vendorEl);
    if (order.siteName) {
      const siteEl = document.createElement('span');
      siteEl.className = 'site';
      siteEl.textContent = order.siteName;
      nameWrap.appendChild(siteEl);
    }
    info.appendChild(nameWrap);
    if (order.phone) {
      const phoneEl = document.createElement('div');
      phoneEl.className = 'phone';
      phoneEl.textContent = order.phone;
      info.appendChild(phoneEl);
    }
    body.appendChild(info);
    summary.appendChild(body);

    const badges = document.createElement('div');
    badges.className = 'badges';
    badges.appendChild(paymentBadge(order));
    badges.appendChild(deliveryBadge(order));
    summary.appendChild(badges);

    const actions = document.createElement('div');
    actions.className = 'order-actions';
    const detailBtn = document.createElement('button');
    detailBtn.type = 'button';
    detailBtn.className = 'oa-btn oa-outline';
    const isOpen = expandedOrderId === order.orderId;
    detailBtn.textContent = isOpen ? '접기' : '상세보기';
    const ctaBtn = document.createElement('button');
    ctaBtn.type = 'button';
    ctaBtn.className = 'oa-btn oa-primary';
    ctaBtn.textContent = orderCtaLabel(order);
    const toggle = () => {
      expandedOrderId = (expandedOrderId === order.orderId) ? null : order.orderId;
      renderOrders();
    };
    detailBtn.addEventListener('click', toggle);
    ctaBtn.addEventListener('click', toggle);
    actions.appendChild(detailBtn);
    actions.appendChild(ctaBtn);
    summary.appendChild(actions);

    const detail = document.createElement('div');
    detail.className = 'order-detail';
    if (isOpen) {
      detail.classList.add('show');
      buildOrderDetail(detail, order);
    }

    card.appendChild(summary);
    card.appendChild(detail);
    return card;
  }

  function buildOrderDetail(container, order) {
    const paymentConfirmed = order.paymentStatus === '완납' || order.paymentStatus === '추후입금';

    if (!order.invoiceRegistered) {
      const lock = document.createElement('div');
      lock.className = 'lock-box';
      lock.innerHTML = '<span class="icon">🧾</span>아직 전표가 등록되지 않았어요.<br>사무실에 확인해주세요.';
      container.appendChild(lock);
      return;
    }

    if (!paymentConfirmed) {
      const lock = document.createElement('div');
      lock.className = 'lock-box';
      lock.innerHTML = '<span class="icon">🔒</span>입금 확인 전이에요.<br>입금이 확인되면 배송 내용을 볼 수 있어요.';
      container.appendChild(lock);
      return;
    }

    container.appendChild(buildDeliverySection(order));
  }

  function getCheckDraft(order) {
    if (!checkDrafts[order.orderId]) {
      const deliveries = {};
      order.items.forEach((it) => {
        let prefill = it.qty;
        if (it.deliveredQty !== null && it.deliveredQty !== undefined) prefill = it.deliveredQty;
        else if (it.deliveryStatus === '누락') prefill = 0;
        deliveries[it.name] = prefill;
      });
      checkDrafts[order.orderId] = deliveries;
    }
    return checkDrafts[order.orderId];
  }

  function buildDeliverySection(order) {
    const sec = document.createElement('div');
    sec.className = 'detail-section';
    const h3 = document.createElement('h3');
    h3.textContent = '배송 체크';
    sec.appendChild(h3);

    const deliveries = getCheckDraft(order);

    order.items.forEach((it) => {
      const row = document.createElement('div');
      row.className = 'check-row';
      row.setAttribute('role', 'button');
      row.tabIndex = 0;

      const nm = document.createElement('span');
      nm.className = 'itnm';
      nm.textContent = it.name + (it.spec ? ' (' + it.spec + ')' : '') + ' 주문 ' + it.qty;
      row.appendChild(nm);

      const shortfall = document.createElement('span');
      shortfall.className = 'shortfall-tag';

      const qtyDisplay = document.createElement('span');
      qtyDisplay.className = 'qty-display';

      const qtyInput = document.createElement('input');
      qtyInput.type = 'text';
      qtyInput.inputMode = 'numeric';
      qtyInput.className = 'qty-input';
      qtyInput.style.display = 'none';

      function currentQty() { return Number(deliveries[it.name]) || 0; }

      function refresh() {
        const q = currentQty();
        qtyDisplay.textContent = q;
        row.classList.toggle('done', it.qty > 0 && q >= it.qty);
        const diff = it.qty - q;
        shortfall.textContent = diff > 0 ? diff + '개 부족' : '';
      }

      function setQty(q) {
        deliveries[it.name] = Math.max(0, Number(q) || 0);
        refresh();
      }

      function enterEditMode() {
        qtyInput.value = currentQty();
        qtyDisplay.style.display = 'none';
        qtyInput.style.display = '';
        qtyInput.focus();
        qtyInput.select();
      }
      function exitEditMode() {
        setQty(qtyInput.value);
        qtyInput.style.display = 'none';
        qtyDisplay.style.display = '';
      }

      qtyDisplay.addEventListener('click', (e) => { e.stopPropagation(); enterEditMode(); });
      qtyInput.addEventListener('click', (e) => e.stopPropagation());
      qtyInput.addEventListener('input', () => { qtyInput.value = qtyInput.value.replace(/[^\d]/g, ''); });
      qtyInput.addEventListener('blur', exitEditMode);
      qtyInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); qtyInput.blur(); }
      });

      row.addEventListener('click', () => { setQty(currentQty() >= it.qty ? 0 : it.qty); });
      row.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setQty(currentQty() >= it.qty ? 0 : it.qty); }
      });

      refresh();

      row.appendChild(shortfall);
      row.appendChild(qtyDisplay);
      row.appendChild(qtyInput);

      if (order.deliveryStatus === '일부누락' && (it.deliveryStatus === '누락' || it.deliveryStatus === '부분누락')) {
        const st = document.createElement('span');
        st.className = 'cst';
        const missing = it.qty - (it.deliveredQty || 0);
        st.textContent = '이전 배송마감 · ' + missing + '개 누락';
        row.appendChild(st);
      }
      sec.appendChild(row);
    });

    const actions = document.createElement('div');
    actions.className = 'form-actions';

    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'btn-ghost';
    saveBtn.textContent = '진행상태 저장';

    const finalizeBtn = document.createElement('button');
    finalizeBtn.type = 'button';
    finalizeBtn.className = 'btn-primary';
    finalizeBtn.textContent = '배송 마감';

    const msg = document.createElement('div');
    msg.className = 'section-msg';

    async function submitDelivery(finalize, btn) {
      btn.disabled = true;
      msg.textContent = '저장 중...';
      msg.className = 'section-msg';
      try {
        const deliveryList = order.items.map((it) => ({ name: it.name, qty: Number(deliveries[it.name]) || 0 }));
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          body: JSON.stringify({ action: 'save_delivery', orderId: order.orderId, deliveries: deliveryList, finalize: finalize })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || '저장하지 못했어요.');
        msg.textContent = finalize ? '배송 마감했어요.' : '저장됐어요.';
        msg.className = 'section-msg ok';
        await loadDayOrders();
      } catch (err) {
        msg.textContent = err.message || String(err);
        msg.className = 'section-msg err';
        btn.disabled = false;
      }
    }

    saveBtn.addEventListener('click', () => submitDelivery(false, saveBtn));

    let finalizeArmed = false;
    let finalizeTimer = null;
    finalizeBtn.addEventListener('click', () => {
      if (!finalizeArmed) {
        finalizeArmed = true;
        finalizeBtn.textContent = '한 번 더 누르면 마감돼요';
        finalizeTimer = setTimeout(() => {
          finalizeArmed = false;
          finalizeBtn.textContent = '배송 마감';
        }, 3000);
        return;
      }
      clearTimeout(finalizeTimer);
      finalizeArmed = false;
      finalizeBtn.textContent = '배송 마감';
      submitDelivery(true, finalizeBtn);
    });

    actions.appendChild(saveBtn);
    actions.appendChild(finalizeBtn);
    sec.appendChild(actions);
    sec.appendChild(msg);
    return sec;
  }

  loadDayOrders();
</script>

</body>
</html>
