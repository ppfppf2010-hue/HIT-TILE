<body class="bg-surface text-textMain min-h-screen flex flex-col pb-24">

    <!-- 상단 헤더 -->
    <header class="bg-cardBg border-b border-borderGray sticky top-0 z-30 px-4 py-3 shadow-sm">
        <div class="max-w-md mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-lg bg-primary text-white flex items-center justify-center font-bold text-sm shadow-sm">🧱</div>
                <div>
                    <h1 class="font-bold text-base leading-tight">히트타일</h1>
                    <p class="text-xs text-textSub">업무용 허브</p>
                </div>
            </div>
            <span class="inline-flex items-center px-2 py-0.5 rounded text-[11px] font-medium bg-red-50 text-primary border border-red-200">LIVE</span>
        </div>
    </header>

    <!-- 공지 배너 (최신 업데이트 1건) -->
    <div class="max-w-md mx-auto w-full px-4 pt-3">
        <div class="bg-cardBg border border-borderGray rounded-xl p-3 shadow-sm flex items-center justify-between">
            <div class="flex items-center space-x-2.5 overflow-hidden">
                <span class="shrink-0 w-2 h-2 rounded-full bg-primary animate-pulse"></span>
                <p class="text-xs text-textSub truncate" id="bannerText"></p>
            </div>
            <a id="bannerLink" href="#" target="_blank" rel="noopener" class="shrink-0 text-xs font-medium text-primary hover:underline ml-2">확인 →</a>
        </div>
    </div>

    <!-- 검색 바 -->
    <div class="max-w-md mx-auto w-full px-4 pt-3">
        <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">🔍</span>
            <input type="text" id="searchInput" oninput="renderMenus()" placeholder="업무 메뉴, 설명 검색..." class="w-full pl-9 pr-4 py-2.5 bg-cardBg border border-borderGray rounded-xl text-sm focus:outline-none focus:border-primary transition shadow-sm">
        </div>
    </div>

    <!-- 카테고리 탭 -->
    <div class="max-w-md mx-auto w-full px-4 pt-3 overflow-x-auto no-scrollbar flex space-x-1.5 shrink-0" id="categoryBar"></div>

    <!-- 메뉴 -->
    <main class="max-w-md mx-auto w-full px-4 pt-4 space-y-3 flex-1 mb-6" id="menuContainer"></main>

    <!-- 하단 네비게이션 -->
    <nav class="fixed bottom-0 left-0 right-0 bg-cardBg border-t border-borderGray z-40 shadow-lg">
        <div class="max-w-md mx-auto flex justify-around py-2">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center justify-center w-1/3 text-primary">
                <span class="text-lg">🏠</span><span class="text-[10px] font-medium mt-0.5">홈</span>
            </button>
            <button onclick="switchTab('starred')" id="nav-starred" class="flex flex-col items-center justify-center w-1/3 text-gray-400">
                <span class="text-lg">⭐</span><span class="text-[10px] font-medium mt-0.5">즐겨찾기</span>
            </button>
            <button onclick="switchTab('updates')" id="nav-updates" class="flex flex-col items-center justify-center w-1/3 text-gray-400">
                <span class="text-lg">📢</span><span class="text-[10px] font-medium mt-0.5">업데이트</span>
            </button>
        </div>
    </nav>

    <!-- 복사 알림 -->
    <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-20 z-50 px-4 py-2 rounded-full bg-textMain text-white text-xs shadow-lg opacity-0 transition pointer-events-none"></div>

    <script>
        const BASE = 'https://ppfppf2010-hue.github.io/HIT-TILE/';
        const SHEET = 'https://docs.google.com/spreadsheets/d/1XBzkR5oVC1kmRkT270FnbIm_IdRzzumpB48TGorKJSM/edit';
        const CALENDAR = 'https://calendar.google.com/calendar/embed?src=38bc0fbbfaf776f1ec42c0996473cfa79e91257a3162c50af55ab7d2461aeeef%40group.calendar.google.com&ctz=Asia%2FSeoul';

        const categories = [
            { id: 'all', name: '전체' },
            { id: 'consult', name: '고객상담' },
            { id: 'photo', name: '사진·카탈로그' },
            { id: 'schedule', name: '일정' },
            { id: 'delivery', name: '배송' },
            { id: 'material', name: '자재·판매·구매' },
            { id: 'payment', name: '결제' }
        ];

        // badge: 누가 쓰는 화면인지 (사무실 / 고객용 / 기사용 / 시트 / 캘린더)
        const menuData = [
            { id: 'checklist', title: '상담 체크리스트', category: 'consult', desc: '상담 기록 · 고객 리포트(A4) · 수량계산 · 판매등록 연결', url: BASE + 'checklist/', icon: '📋', badge: '사무실' },
            { id: 'tilecalc', title: '타일량 계산기', category: 'consult', desc: '공간별 박스 · 압착 · 본드 · 에폭시 · 몰탈 → 판매등록', url: BASE + 'tile-calc/', icon: '📐', badge: '사무실' },
            { id: 'catalog', title: '시공사진 카탈로그', category: 'photo', desc: '고객에게 보여주는 시공 사례 갤러리', url: BASE + 'catalog/', icon: '🖼️', badge: '고객용' },
            { id: 'photoupload', title: '사진 업로드 도우미', category: 'photo', desc: '시공사진 일괄 업로드 · 시트 자동 등록', url: BASE + 'photo-upload/', icon: '📤', badge: '사무실' },
            { id: 'calendar', title: '히트타일 배송일정', category: 'schedule', desc: '배송 · 반품 픽업 캘린더', url: CALENDAR, icon: '📅', badge: '캘린더' },
            { id: 'delivery', title: '배송관리', category: 'delivery', desc: '날짜별 배송 등록 · 전표 · 입금 · 배송체크 · 반품', url: BASE + 'delivery/', icon: '📦', badge: '사무실' },
            { id: 'driver', title: '배송기사 페이지', category: 'delivery', desc: '현장 확인 · 배송체크 · 완료 사진 (금액 없음)', url: BASE + 'driver/', icon: '🚚', badge: '기사용' },
            { id: 'sale', title: '판매등록', category: 'material', desc: '거래처 · 품목 · 수량 직접 입력 → 판매확인중 → 이카운트', url: BASE + 'sale/', icon: '💰', badge: '사무실' },
            { id: 'purchase', title: '구매등록', category: 'material', desc: '매입 거래명세서 사진 업로드 · 거래처/품목 자동 인식', url: BASE + 'purchase/', icon: '🧾', badge: '사무실' },
            { id: 'itemreg', title: '품목등록', category: 'material', desc: '거래명세서 업로드 또는 직접 입력 → 마스터 · 이카운트', url: BASE + 'itemregister/', icon: '🏷️', badge: '사무실' },
            { id: 'master', title: '히트타일 구글 시트', category: 'material', desc: '품목등록마스터 · 거래처코드관리 · 판매/구매입력', url: SHEET, icon: '📁', badge: '시트' },
            { id: 'balance', title: '거래처 잔액', category: 'payment', desc: '거래처별 미수금 현황 · 금액순 정렬', url: BASE + 'balance/', icon: '💳', badge: '사무실' }
        ];

        // 최근 업데이트 — 새로 바뀐 게 있으면 맨 위에 추가한다(첫 줄이 상단 배너에 나옴)
        const updates = [
            { tag: 'NEW', date: '10/29', title: '상담 고객 리포트 (A4 출력)', body: '상담체크리스트에서 고르신 타일 · 도기를 사진 카드로 정리해 출력. 타일 1장 · 도기 1장', link: BASE + 'checklist/' },
            { tag: 'NEW', date: '10/23', title: '타일량 계산기 → 판매등록 바로 진행', body: '계산 결과로 판매등록 화면이 채워지고, 적요에 공간명(외욕실 · 내욕실 · 현관 등)이 들어감. 베란다 등 바닥은 + 버튼으로 구역 추가', link: BASE + 'tile-calc/' },
            { tag: 'UPDATE', date: '10/20', title: '타일량 계산기 추가', body: '공간별 박스 · 압착 · 본드 · 에폭시 · 몰탈 · 발주서, 상담 체크리스트와 연결', link: BASE + 'tile-calc/' },
            { tag: 'UPDATE', date: '', title: '배송기사 전용 페이지', body: '현장명 확인 · 배송 부족분 기록 (전표 · 금액 비공개)', link: BASE + 'driver/' }
        ];

        // 시크릿 창 · 카톡 인앱브라우저처럼 저장이 막힌 곳에서도 화면은 떠야 하므로 저장 실패는 무시한다
        function loadStarred() {
            try { return JSON.parse(localStorage.getItem('hittile_starred') || '[]') || []; } catch (e) { return []; }
        }
        function saveStarred() {
            try { localStorage.setItem('hittile_starred', JSON.stringify(starredIds)); } catch (e) { /* 저장 불가 환경 */ }
        }

        let currentCategory = 'all';
        let currentTab = 'home';
        let starredIds = loadStarred();

        function renderCategories() {
            document.getElementById('categoryBar').innerHTML = categories.map(c => `
                <button onclick="setCategory('${c.id}')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition shrink-0 ${c.id === currentCategory ? 'bg-primary text-white shadow-sm' : 'bg-cardBg text-textSub border border-borderGray'}">${c.name}</button>
            `).join('');
        }

        function renderMenus() {
            const container = document.getElementById('menuContainer');
            const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();

            if (currentTab === 'updates') {
                container.innerHTML = `
                    <div class="bg-cardBg border border-borderGray rounded-2xl p-4 shadow-sm space-y-3">
                        <h2 class="font-bold text-sm text-textMain border-b border-borderGray pb-2">📋 최근 업데이트 내역</h2>
                        <div class="space-y-3 text-xs text-textSub">
                            ${updates.map(u => `
                                <a href="${u.link}" target="_blank" rel="noopener" class="block p-2.5 bg-surface rounded-xl border border-borderGray">
                                    <span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-bold ${u.tag === 'NEW' ? 'bg-primary' : 'bg-gray-700'} text-white mb-1">${u.tag}</span>
                                    ${u.date ? `<span class="text-[10px] text-gray-400 ml-1">${u.date}</span>` : ''}
                                    <p class="font-semibold text-textMain">${u.title}</p>
                                    <p class="text-[11px] mt-0.5">${u.body}</p>
                                </a>`).join('')}
                        </div>
                    </div>`;
                return;
            }

            const catName = id => (categories.find(c => c.id === id) || {}).name || '';
            const filtered = menuData.filter(item => {
                const matchCat = currentCategory === 'all' || item.category === currentCategory;
                const matchTab = currentTab !== 'starred' || starredIds.includes(item.id);
                const text = (item.title + ' ' + item.desc + ' ' + catName(item.category)).toLowerCase();
                return matchCat && matchTab && (!searchVal || text.includes(searchVal));
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-gray-400">
                        <p class="text-3xl mb-2">${currentTab === 'starred' ? '⭐' : '🔍'}</p>
                        <p class="text-sm">${currentTab === 'starred' && !starredIds.length ? '메뉴 오른쪽 ☆을 눌러 즐겨찾기에 추가하세요.' : '검색 결과가 없습니다.'}</p>
                    </div>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const isStarred = starredIds.includes(item.id);
                return `
                    <div class="bg-cardBg border border-borderGray rounded-2xl p-3.5 shadow-sm hover:border-primary transition flex items-center justify-between">
                        <a href="${item.url}" target="_blank" rel="noopener" class="flex items-center space-x-3 flex-1 min-w-0 pr-1">
                            <div class="w-11 h-11 rounded-xl bg-surface border border-borderGray flex items-center justify-center text-xl shrink-0">${item.icon}</div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-center space-x-1.5">
                                    <h3 class="font-bold text-sm text-textMain truncate">${item.title}</h3>
                                    <span class="px-1.5 py-0.5 text-[10px] font-semibold bg-gray-100 text-textSub rounded shrink-0">${item.badge}</span>
                                </div>
                                <p class="text-xs text-textSub truncate mt-0.5">${item.desc}</p>
                            </div>
                        </a>
                        <button onclick="copyUrl('${item.id}')" class="p-2 text-xs font-medium text-textSub hover:text-primary transition shrink-0" aria-label="주소 복사">복사</button>
                        <button onclick="toggleStar('${item.id}')" class="p-2 text-lg text-gray-300 hover:text-amber-500 transition shrink-0" aria-label="즐겨찾기">${isStarred ? '⭐' : '☆'}</button>
                    </div>`;
            }).join('');
        }

        function setCategory(cat) {
            currentCategory = cat;
            renderCategories();
            renderMenus();
        }

        function switchTab(tab) {
            currentTab = tab;
            ['home', 'starred', 'updates'].forEach(t => {
                document.getElementById(`nav-${t}`).className = 'flex flex-col items-center justify-center w-1/3 ' + (t === tab ? 'text-primary' : 'text-gray-400');
            });
            renderMenus();
        }

        function toggleStar(id) {
            starredIds = starredIds.includes(id) ? starredIds.filter(i => i !== id) : starredIds.concat(id);
            saveStarred();
            renderMenus();
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.opacity = '1';
            clearTimeout(showToast.timer);
            showToast.timer = setTimeout(() => { t.style.opacity = '0'; }, 1600);
        }

        // 카톡으로 보낼 주소 복사. 클립보드가 막힌 환경(인앱브라우저 등)은 예전 방식으로 대신 복사한다
        function copyUrl(id) {
            const item = menuData.find(m => m.id === id);
            if (!item) return;
            const fallback = () => {
                const ta = document.createElement('textarea');
                ta.value = item.url;
                ta.setAttribute('readonly', '');
                ta.style.position = 'fixed'; ta.style.opacity = '0';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
                ta.remove();
                if (ok) showToast(`${item.title} 주소를 복사했어요`);
                else prompt('아래 주소를 길게 눌러 복사하세요', item.url);
            };
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(item.url).then(() => showToast(`${item.title} 주소를 복사했어요`), fallback);
            } else {
                fallback();
            }
        }

        const latest = updates[0];
        document.getElementById('bannerText').innerHTML = `<strong class="text-textMain font-semibold">최신 업데이트:</strong> ${latest.title}`;
        document.getElementById('bannerLink').href = latest.link;

        renderCategories();
        renderMenus();
    </script>
</body>
</html>
