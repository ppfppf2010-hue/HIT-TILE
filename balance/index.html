<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>히트타일 거래처 잔액</title>
<style>
  :root{
    --bg:#f6f3ee;
    --ink:#2c2a27;
    --muted:#726d64;
    --line:rgba(44,42,39,0.14);
    --brass:#b08d57;
    --brass-deep:#8c6b3e;
    --warn:#b1503f;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Malgun Gothic',sans-serif;
    background:var(--bg);
    color:var(--ink);
    padding:0 0 60px;
  }
  header{
    padding:32px 6vw 20px;
    border-bottom:1px solid var(--line);
    position:relative;
  }
  header h1{
    margin:0 0 6px;
    font-size:22px;
  }
  header p{
    margin:0;
    color:var(--muted);
    font-size:13px;
  }
  .edit-toggle{
    position:absolute;
    top:32px;
    right:6vw;
    font-family:inherit;
    font-size:12px;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    cursor:pointer;
  }
  .edit-toggle:hover{ border-color:var(--brass); color:var(--brass-deep); }
  .edit-toggle.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  main{
    max-width:640px;
    margin:0 auto;
    padding:24px 6vw 0;
  }

  .summary-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:20px 22px;
    margin-bottom:20px;
  }
  .summary-card .label{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:6px;
  }
  .summary-card .total{
    font-size:28px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .summary-card .updated{
    margin-top:8px;
    font-size:11.5px;
    color:var(--muted);
  }

  .list-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }

  .list-head{
    display:grid;
    grid-template-columns:1fr auto;
    padding:12px 18px;
    background:#faf8f4;
    border-bottom:1px solid var(--line);
  }
  .list-head span{
    font-size:11.5px;
    color:var(--muted);
    font-weight:600;
  }
  .amount-toggle{
    display:flex;
    align-items:center;
    gap:4px;
    background:none;
    border:none;
    font-size:11.5px;
    color:var(--muted);
    font-weight:600;
    cursor:pointer;
    padding:0;
    font-family:inherit;
  }
  .amount-toggle:hover{ color:var(--brass-deep); }
  .amount-toggle svg{ width:12px; height:12px; }

  .row{
    display:grid;
    grid-template-columns:1fr auto;
    align-items:center;
    padding:16px 18px;
    border-bottom:1px solid var(--line);
  }
  .row:last-child{ border-bottom:none; }
  .row .name{
    font-size:15px;
    font-weight:600;
  }
  .row .amount{
    font-size:17px;
    font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .row .amount.zero{ color:var(--muted); font-weight:500; }
  .row .amount.positive{ color:var(--warn); }

  .row.edit-row{
    grid-template-columns:1fr 130px 32px;
    gap:8px;
  }
  .row.edit-row input{
    font-family:inherit;
    border:1px solid var(--line);
    border-radius:8px;
    padding:8px 10px;
    font-size:14px;
    color:var(--ink);
    width:100%;
  }
  .row.edit-row input.amount-input{
    text-align:right;
    font-variant-numeric:tabular-nums;
  }
  .row.edit-row input:focus{ outline:none; border-color:var(--brass); }
  .row-delete{
    width:32px;
    height:32px;
    border-radius:8px;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--warn);
    cursor:pointer;
    font-size:15px;
    line-height:1;
  }
  .row-delete:hover{ border-color:var(--warn); background:#fbeeeb; }

  .add-row-btn{
    display:block;
    width:100%;
    padding:14px 18px;
    border:none;
    background:#faf8f4;
    color:var(--muted);
    font-size:13.5px;
    font-family:inherit;
    cursor:pointer;
    text-align:left;
  }
  .add-row-btn:hover{ color:var(--brass-deep); }

  .save-btn{
    margin-top:16px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:var(--ink);
    color:#fff;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .save-btn:hover{ background:var(--brass-deep); }
  .save-btn:disabled{ background:#ccc7bd; cursor:default; }

  .save-status{
    margin-top:10px;
    font-size:12.5px;
    color:var(--muted);
    text-align:center;
    min-height:16px;
  }

  .empty, .error-box, .loading{
    padding:40px 20px;
    text-align:center;
    color:var(--muted);
    font-size:14px;
  }
  .error-box{ color:var(--warn); }

  .refresh-btn{
    margin-top:16px;
    width:100%;
    padding:12px;
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--card);
    color:var(--ink);
    font-size:13px;
    cursor:pointer;
    font-family:inherit;
  }
  .refresh-btn:hover{ border-color:var(--brass); color:var(--brass-deep); }

  .note{
    margin-top:18px;
    font-size:12px;
    color:var(--muted);
    line-height:1.6;
  }
</style>
</head>
<body>

<header>
  <h1>히트타일 거래처 잔액</h1>
  <p>거래처별 미수금 현황이에요. 금액을 눌러서 정렬 순서를 바꿀 수 있어요.</p>
  <button class="edit-toggle" id="editToggle" type="button">편집</button>
</header>

<main>

  <div class="summary-card">
    <div class="label">전체 미수금 합계</div>
    <div class="total" id="totalAmount">-</div>
    <div class="updated" id="updatedAt"></div>
  </div>

  <div class="list-card">
    <div class="list-head" id="listHead">
      <span>거래처명</span>
      <button class="amount-toggle" id="sortToggle">
        미수금
        <svg id="sortIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M19 12l-7 7-7-7"/></svg>
      </button>
    </div>
    <div id="listBody">
      <div class="loading">불러오는 중...</div>
    </div>
    <button class="add-row-btn" id="addRowBtn" style="display:none;">+ 거래처 추가</button>
  </div>

  <datalist id="vendorNameList"></datalist>

  <button class="save-btn" id="saveBtn" style="display:none;">저장하기</button>
  <div class="save-status" id="saveStatus"></div>

  <button class="refresh-btn" id="refreshBtn">새로고침</button>

  <p class="note" id="noteText">
    금액을 고치려면 우측 상단 "편집"을 눌러서 이 화면에서 바로 수정·추가할 수 있어요.
  </p>

</main>

<script>
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbzx_vaUy7Ar1mqidKErG2WYcwNZpL6FGsfI8JNR0nILnSW9hf4bJ_N8aJmDM8J0DOKWwQ/exec';

  const listBody = document.getElementById('listBody');
  const listHead = document.getElementById('listHead');
  const totalAmount = document.getElementById('totalAmount');
  const updatedAt = document.getElementById('updatedAt');
  const sortToggle = document.getElementById('sortToggle');
  const sortIcon = document.getElementById('sortIcon');
  const refreshBtn = document.getElementById('refreshBtn');
  const editToggle = document.getElementById('editToggle');
  const addRowBtn = document.getElementById('addRowBtn');
  const saveBtn = document.getElementById('saveBtn');
  const saveStatus = document.getElementById('saveStatus');
  const noteText = document.getElementById('noteText');

  let rows = [];
  let sortDir = 'desc'; // desc = 큰 금액 먼저
  let editMode = false;
  let knownVendorNames = [];

  async function loadVendorNames() {
    try {
      const res = await fetch(ENDPOINT + '?action=vendor_names');
      const data = await res.json();
      if (data.ok) {
        knownVendorNames = data.names || [];
        const list = document.getElementById('vendorNameList');
        list.innerHTML = '';
        knownVendorNames.forEach((n) => {
          const opt = document.createElement('option');
          opt.value = n;
          list.appendChild(opt);
        });
      }
    } catch (err) { /* 자동완성 실패해도 조용히 무시 */ }
  }

  function formatWon(n) {
    return Number(n).toLocaleString('ko-KR') + '원';
  }

  function computeTotal(list) {
    return list.reduce((sum, r) => sum + (Number(r.balance) || 0), 0);
  }

  function render() {
    totalAmount.textContent = formatWon(computeTotal(rows));

    if (editMode) {
      renderEditRows();
      return;
    }

    if (!rows.length) {
      listBody.innerHTML = '<div class="empty">등록된 거래처가 없어요.</div>';
      return;
    }

    const sorted = [...rows].sort((a, b) => sortDir === 'desc' ? b.balance - a.balance : a.balance - b.balance);

    listBody.innerHTML = '';
    sorted.forEach((r) => {
      const row = document.createElement('div');
      row.className = 'row';

      const nameEl = document.createElement('div');
      nameEl.className = 'name';
      nameEl.textContent = r.name;

      const amountEl = document.createElement('div');
      const bal = Number(r.balance) || 0;
      amountEl.className = 'amount' + (bal === 0 ? ' zero' : ' positive');
      amountEl.textContent = formatWon(bal);

      row.appendChild(nameEl);
      row.appendChild(amountEl);
      listBody.appendChild(row);
    });
  }

  function renderEditRows() {
    listBody.innerHTML = '';
    rows.forEach((r, idx) => {
      const row = document.createElement('div');
      row.className = 'row edit-row';

      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.value = r.name;
      nameInput.placeholder = '거래처명';
      nameInput.setAttribute('list', 'vendorNameList');
      nameInput.addEventListener('input', () => { rows[idx].name = nameInput.value; });

      const amountInput = document.createElement('input');
      amountInput.type = 'number';
      amountInput.className = 'amount-input';
      amountInput.value = r.balance;
      amountInput.placeholder = '0';
      amountInput.addEventListener('input', () => {
        rows[idx].balance = Number(amountInput.value) || 0;
        totalAmount.textContent = formatWon(computeTotal(rows));
      });

      const delBtn = document.createElement('button');
      delBtn.className = 'row-delete';
      delBtn.type = 'button';
      delBtn.textContent = '×';
      delBtn.addEventListener('click', () => {
        rows.splice(idx, 1);
        render();
      });

      row.appendChild(nameInput);
      row.appendChild(amountInput);
      row.appendChild(delBtn);
      listBody.appendChild(row);
    });

    if (!rows.length) {
      listBody.innerHTML = '<div class="empty">아직 등록된 거래처가 없어요. 아래에서 추가해주세요.</div>';
    }
  }

  function updateSortIcon() {
    sortIcon.style.transform = sortDir === 'asc' ? 'rotate(180deg)' : 'rotate(0deg)';
  }

  sortToggle.addEventListener('click', () => {
    sortDir = sortDir === 'desc' ? 'asc' : 'desc';
    updateSortIcon();
    render();
  });

  function setEditMode(on) {
    editMode = on;
    editToggle.textContent = on ? '완료' : '편집';
    editToggle.classList.toggle('active', on);
    listHead.style.display = on ? 'none' : 'grid';
    addRowBtn.style.display = on ? 'block' : 'none';
    saveBtn.style.display = on ? 'block' : 'none';
    refreshBtn.style.display = on ? 'none' : 'block';
    noteText.style.display = on ? 'none' : 'block';
    saveStatus.textContent = '';
    render();
  }

  editToggle.addEventListener('click', () => setEditMode(!editMode));

  addRowBtn.addEventListener('click', () => {
    rows.push({ name: '', balance: 0 });
    renderEditRows();
    const inputs = listBody.querySelectorAll('.edit-row input');
    if (inputs.length) inputs[inputs.length - 2].focus();
  });

  saveBtn.addEventListener('click', async () => {
    saveBtn.disabled = true;
    saveStatus.textContent = '저장 중이에요...';
    try {
      const res = await fetch(ENDPOINT, {
        method: 'POST',
        body: JSON.stringify({ action: 'save_balances', rows: rows })
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '저장하지 못했어요.');
      saveStatus.textContent = '저장됐어요. (' + data.count + '개 거래처)';
      setTimeout(() => { setEditMode(false); load(); }, 800);
    } catch (err) {
      saveStatus.textContent = '오류: ' + (err.message || String(err));
    } finally {
      saveBtn.disabled = false;
    }
  });

  async function load() {
    if (!editMode) listBody.innerHTML = '<div class="loading">불러오는 중...</div>';
    try {
      const res = await fetch(ENDPOINT + '?action=balances');
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '불러오지 못했어요.');
      rows = data.rows || [];
      updatedAt.textContent = data.updatedAt ? ('업데이트: ' + new Date(data.updatedAt).toLocaleString('ko-KR')) : '';
      updateSortIcon();
      render();
    } catch (err) {
      listBody.innerHTML = '<div class="error-box">' + (err.message || String(err)) + '</div>';
    }
  }

  refreshBtn.addEventListener('click', load);

  load();
  loadVendorNames();
</script>

</body>
</html>
